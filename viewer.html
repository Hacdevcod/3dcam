<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3dcam AR</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#000;overflow:hidden;height:100dvh;width:100dvw;position:fixed}
        #start{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14;z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px;color:#fff;text-align:center}
        h2{font-size:1.3em;margin-bottom:8px;color:#a29bfe}
        p{opacity:.7;margin-bottom:18px;font-size:.9em;line-height:1.4}
        .btn{display:block;width:100%;max-width:280px;padding:16px;border:none;border-radius:16px;font-size:1.1em;font-weight:600;cursor:pointer;margin:8px auto;color:#fff}
        .btn-go{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
        #scanScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000}
        #scanScreen.on{display:block}
        #reader{width:100%!important;height:100%!important}
        #reader video{width:100%!important;height:100%!important;object-fit:cover!important}
        #reader img,#reader__scan_region,#reader__dashboard_section,#html5-qrcode-button-camera-permission,#html5-qrcode-button-camera-start,#html5-qrcode-button-camera-stop{display:none!important}
        .bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.8);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.8em}
        .dot{width:8px;height:8px;border-radius:50%;background:#f44;animation:pulse 1s infinite}
        .dot.ok{background:#0f8;animation:none}@keyframes pulse{50%{transform:scale(1.8);opacity:.4}}
        #arScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000}
        #arScreen.on{display:flex;align-items:center;justify-content:center;flex-direction:column}
        #arScreen img{max-width:90%;max-height:80%;border-radius:15px;border:3px solid #6c5ce7;box-shadow:0 0 40px rgba(108,92,231,.5);animation:glow 2s infinite}
        @keyframes glow{50%{box-shadow:0 0 60px rgba(0,206,201,.7)}}
        .ar-label{color:#00cec9;font-size:1.2em;margin-top:15px}
        .ctrls{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:8px}
        .ctrl{width:44px;height:44px;border-radius:50%;background:rgba(108,92,231,.8);border:none;color:#fff;font-size:1.2em;cursor:pointer}
        .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.9);color:#fff;padding:10px 20px;border-radius:20px;font-size:.8em;z-index:200;transition:.3s;pointer-events:none}
        .toast.show{transform:translateX(-50%) translateY(0)}
    </style>
</head>
<body>

<div id="start">
    <div style="font-size:60px;margin-bottom:10px">ð¸</div>
    <h2>3dcam AR</h2>
    <p>1. Clique INICIAR<br>2. Aponte para o QR Code<br>3. Veja a imagem!</p>
    <button class="btn btn-go" onclick="startScan()">ð· INICIAR</button>
</div>

<div id="scanScreen">
    <div class="bar">
        <span style="display:flex;align-items:center;gap:8px"><div class="dot" id="sd"></div><span id="st">Aponte para o QR Code</span></span>
        <button class="ctrl" onclick="stopScan()" style="position:static;width:auto;height:auto;border-radius:20px;padding:6px 14px;font-size:.75em">â</button>
    </div>
    <div id="reader"></div>
</div>

<div id="arScreen">
    <img id="arImg" src="" alt="AR">
    <p class="ar-label">â¨ Imagem Detectada â¨</p>
    <div class="ctrls">
        <button class="ctrl" onclick="closeAR()">â</button>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
var scanner=null;
var imageList=[];
var currentIndex=0;

// Lista de imagens do GitHub (atualize com suas imagens)
var GITHUB_IMAGES=[
    'https://hacdevcod.github.io/3dcam/images/img_test.png'
];

function startScan(){
    document.getElementById('start').style.display='none';
    document.getElementById('scanScreen').classList.add('on');
    
    scanner=new Html5Qrcode("reader");
    scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:200,height:200},aspectRatio:1.0},
        function(text){
            console.log('QR Lido:',text);
            document.getElementById('sd').classList.add('ok');
            document.getElementById('st').textContent='â QR Lido!';
            if(navigator.vibrate)navigator.vibrate([50,30,50,100]);
            if(scanner){scanner.stop().catch(function(){});scanner=null;}
            setTimeout(function(){
                document.getElementById('scanScreen').classList.remove('on');
                showImage();
            },500);
        },
        function(){}
    ).catch(function(err){
        alert('Erro: CÃ¢mera bloqueada!\n\nVÃ¡ em: Chrome > ConfiguraÃ§Ãµes > Site > CÃ¢mera > Permitir');
        document.getElementById('start').style.display='flex';
        document.getElementById('scanScreen').classList.remove('on');
    });
}

function showImage(){
    // Tentar localStorage primeiro
    var img=localStorage.getItem('currentImage')||localStorage.getItem('finalImage');
    
    // Se nÃ£o tiver, usar imagem de teste do GitHub
    if(!img||img.length<100){
        img=GITHUB_IMAGES[0]||createTestImage();
    }
    
    console.log('Mostrando imagem...');
    document.getElementById('arImg').src=img;
    document.getElementById('arScreen').classList.add('on');
    toast('â¨ Imagem carregada!');
}

function createTestImage(){
    // Criar uma imagem de teste colorida
    var c=document.createElement('canvas');
    c.width=600;c.height=400;
    var ctx=c.getContext('2d');
    var grd=ctx.createLinearGradient(0,0,600,400);
    grd.addColorStop(0,'#6c5ce7');
    grd.addColorStop(1,'#00cec9');
    ctx.fillStyle=grd;
    ctx.fillRect(0,0,600,400);
    ctx.fillStyle='white';
    ctx.font='bold 30px Arial';
    ctx.textAlign='center';
    ctx.fillText('3dcam Funcionando!',300,180);
    ctx.fillText('QR Code lido com sucesso',300,230);
    return c.toDataURL('image/png');
}

function stopScan(){
    if(scanner){scanner.stop().catch(function(){});scanner=null;}
    document.getElementById('scanScreen').classList.remove('on');
    document.getElementById('start').style.display='flex';
}

function closeAR(){
    document.getElementById('arScreen').classList.remove('on');
    document.getElementById('start').style.display='flex';
}

function toast(m){
    var t=document.getElementById('toast');
    t.textContent=m;t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},2000);
}
</script>
</body>
</html>
