<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3dcam Puzzle AR</title>
    
    <!-- MindAR Image Tracking (Grátis e Preciso) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.9.5/dist/mindar-image.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;background:#000;overflow:hidden;height:100dvh;width:100dvw;position:fixed}
        
        #startScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14;z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px;color:#fff;text-align:center}
        h2{font-size:1.3em;margin-bottom:8px;color:#a29bfe}
        .btn{display:block;width:100%;max-width:280px;padding:16px;border:none;border-radius:16px;font-size:1.2em;font-weight:700;cursor:pointer;margin:10px auto;color:#fff}
        .btn-go{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
        
        #scanScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;flex-direction:column}
        #scanScreen.on{display:flex}
        #reader{flex:1;width:100%!important}
        #reader video{width:100%!important;height:100%!important;object-fit:cover!important}
        #reader img,#reader__scan_region,#reader__dashboard_section,#html5-qrcode-button-camera-permission,#html5-qrcode-button-camera-start,#html5-qrcode-button-camera-stop{display:none!important}
        
        .bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.8);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.8em}
        .dot{width:8px;height:8px;border-radius:50%;background:#f44;animation:pulse 1s infinite}
        .dot.ok{background:#0f8;animation:none}@keyframes pulse{50%{transform:scale(1.8);opacity:.4}}
        
        #gameAR{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000}
        #gameAR.on{display:block}
        
        .game-bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.85);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.8em}
        .score{color:#00cec9;font-weight:700}
        
        .game-ctrls{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
        .ctrl{width:44px;height:44px;border-radius:50%;background:rgba(108,92,231,.85);border:none;color:#fff;font-size:1.2em;cursor:pointer}
        .ctrl:active{transform:scale(.9)}
        .ctrl-wide{width:auto;padding:0 20px;border-radius:22px;font-size:.85em;font-weight:700}
        .ctrl-green{background:#00c853;color:#000}
        
        .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.9);color:#fff;padding:10px 22px;border-radius:25px;font-size:.8em;z-index:200;transition:.3s;pointer-events:none}
        .toast.show{transform:translateX(-50%) translateY(0)}
        
        .win-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:500;display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff}
        .win-screen.show{display:flex}
    </style>
</head>
<body>

<div id="startScreen">
    <div style="font-size:60px">🧩</div>
    <h2>3dcam Puzzle AR</h2>
    <p style="opacity:.7;margin-bottom:20px;font-size:.9em">Escaneie o QR Code<br>Depois aponte para a imagem!</p>
    <button class="btn btn-go" onclick="startScan()">📷 ESCANEAR QR</button>
</div>

<div id="scanScreen">
    <div class="bar">
        <span style="display:flex;align-items:center;gap:8px"><div class="dot" id="sd"></div><span id="st">Aponte para o QR Code</span></span>
        <button class="ctrl" onclick="stopScan()" style="position:static;width:auto;height:auto;border-radius:16px;padding:5px 14px;font-size:.75em">✕</button>
    </div>
    <div id="reader"></div>
</div>

<div id="gameAR">
    <div class="game-bar">
        <span>🧩 Puzzle AR</span>
        <span>Peças: <span class="score" id="piecesLeft">9</span></span>
        <span style="opacity:.6;font-size:.7em">Toque na peça para mover</span>
    </div>
    <div class="game-ctrls">
        <button class="ctrl" onclick="shuffle()">🔀</button>
        <button class="ctrl" onclick="resetPuzzle()">🔄</button>
        <button class="ctrl" onclick="capture()">📸</button>
        <button class="ctrl" onclick="closeGame()">✕</button>
    </div>
    <div class="win-screen" id="winScreen">
        <div style="font-size:80px">🎉</div>
        <h2 style="color:#00cec9;margin:15px 0">MONTADO!</h2>
        <button class="btn btn-go" onclick="shuffle()">🔄 JOGAR DE NOVO</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
var scanner;
var scene,camera,renderer,pieces=[],selectedPiece=null,animId;
var totalPieces=9,piecesPlaced=0;
var imgUrl=null,dragging=false;
var raycaster=new THREE.Raycaster();
var mouse=new THREE.Vector2();

// ==================== SCANNER ====================
function startScan(){
    document.getElementById('startScreen').style.display='none';
    document.getElementById('scanScreen').classList.add('on');
    scanner=new Html5Qrcode("reader");
    scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:200,height:200},aspectRatio:1.0},
        function(t){
            document.getElementById('sd').classList.add('ok');
            document.getElementById('st').textContent='✅ QR Lido! Iniciando Puzzle AR...';
            if(navigator.vibrate)navigator.vibrate([50,30,100]);
            if(scanner){scanner.stop().catch(function(){});scanner=null;}
            setTimeout(function(){
                document.getElementById('scanScreen').classList.remove('on');
                loadAndStartAR();
            },500);
        },function(){}
    ).catch(function(){alert('Permita a câmera!');document.getElementById('startScreen').style.display='flex';});
}
function stopScan(){if(scanner){scanner.stop().catch(function(){});scanner=null;}document.getElementById('scanScreen').classList.remove('on');document.getElementById('startScreen').style.display='flex';}

// ==================== CARREGAR IMAGEM ====================
function loadAndStartAR(){
    var img=localStorage.getItem('currentImage')||localStorage.getItem('finalImage');
    if(img&&img.length>500&&img.startsWith('data:image')){imgUrl=img;startPuzzleAR(img);return;}
    var last=localStorage.getItem('lastUploadedImage');
    if(last){testAndStart(last);return;}
    fetch('https://api.github.com/repos/Hacdevcod/3dcam/contents/images')
    .then(function(r){return r.json();})
    .then(function(f){
        if(Array.isArray(f)&&f.length>0)testAndStart('https://raw.githubusercontent.com/Hacdevcod/3dcam/main/images/'+f[f.length-1].name);
        else startPuzzleAR(null);
    }).catch(function(){startPuzzleAR(null);});
}
function testAndStart(u){imgUrl=u;var t=new Image();t.crossOrigin='anonymous';t.onload=function(){startPuzzleAR(u);};t.onerror=function(){startPuzzleAR(null);};t.src=u;}

// ==================== PUZZLE AR COM MINDAR ====================
function startPuzzleAR(src){
    document.getElementById('gameAR').classList.add('on');
    piecesPlaced=0;
    document.getElementById('piecesLeft').textContent='9';
    
    // Usar MindAR para tracking da imagem
    var mindAR=new MindAR.Image({
        container:document.getElementById('gameAR'),
        imageTargetSrc:src||createPuzzleImg(),
        maxTrack:1,
        uiScanning:"no",
        uiLoading:"no"
    });
    
    mindAR.start();
    
    // Configurar Three.js na cena MindAR
    var renderer=new THREE.WebGLRenderer({alpha:true});
    renderer.setSize(window.innerWidth,window.innerHeight);
    document.getElementById('gameAR').appendChild(renderer.domElement);
    
    var scene=new THREE.Scene();
    var camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,100);
    camera.position.set(0,0,5);
    
    // Criar peças do quebra-cabeça
    createPuzzlePieces(scene,src);
    
    // Ancorar no marcador MindAR
    var anchor=mindAR.addAnchor(0);
    anchor.group.add(scene);
    
    // Loop
    mindAR.addEventListener('render',function(){
        renderer.render(scene,camera);
    });
    
    // Touch para mover peças
    setupPuzzleTouch(renderer.domElement,scene,camera);
    
    // Animação
    function anim(){requestAnimationFrame(anim);pieces.forEach(function(p){if(!p.userData.placed)p.rotation.z+=0.003;});}
    anim();
    
    toast('🧩 Puzzle AR iniciado!');
}

function createPuzzlePieces(scene,src){
    var tex=new THREE.TextureLoader().load(src||createPuzzleImg());
    var cols=3,rows=3;
    
    for(var r=0;r<rows;r++){
        for(var c=0;c<cols;c++){
            var geo=new THREE.PlaneGeometry(1,1);
            var mat=new THREE.MeshStandardMaterial({map:tex,roughness:0.4,side:THREE.DoubleSide});
            var piece=new THREE.Mesh(geo,mat);
            
            piece.userData={targetX:(c-1)*1.1,targetY:(1-r)*1.1,placed:false,col:c,row:r};
            piece.position.set((Math.random()-0.5)*6,(Math.random()-0.5)*8,Math.random()*3);
            
            scene.add(new THREE.Mesh(geo,mat));
            pieces.push(piece);
        }
    }
}

function setupPuzzleTouch(domElement,scene,camera){
    var selected=null,dragging=false;
    
    domElement.addEventListener('touchstart',function(e){
        e.preventDefault();
        var touch=e.touches[0];
        mouse.x=(touch.clientX/window.innerWidth)*2-1;
        mouse.y=-(touch.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse,camera);
        var intersects=raycaster.intersectObjects(pieces);
        if(intersects.length>0){selected=intersects[0].object;selected.material.emissive=new THREE.Color(0x333333);dragging=true;}
    },{passive:false});
    
    domElement.addEventListener('touchmove',function(e){
        e.preventDefault();
        if(!dragging||!selected)return;
        var touch=e.touches[0];
        mouse.x=(touch.clientX/window.innerWidth)*2-1;
        mouse.y=-(touch.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse,camera);
        var plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
        var point=new THREE.Vector3();raycaster.ray.intersectPlane(plane,point);
        if(point){selected.position.x=point.x;selected.position.y=point.y;selected.position.z=0.5;}
    },{passive:false});
    
    domElement.addEventListener('touchend',function(){
        if(selected){
            selected.material.emissive=new THREE.Color(0x000000);
            var tx=selected.userData.targetX,ty=selected.userData.targetY;
            if(Math.abs(selected.position.x-tx)<0.5&&Math.abs(selected.position.y-ty)<0.5){
                selected.position.set(tx,ty,0);
                selected.userData.placed=true;
                piecesPlaced++;
                document.getElementById('piecesLeft').textContent=totalPieces-piecesPlaced;
                if(navigator.vibrate)navigator.vibrate(30);
                if(piecesPlaced>=totalPieces)document.getElementById('winScreen').classList.add('show');
                toast('✅ '+piecesPlaced+'/'+totalPieces);
            }
            selected=null;dragging=false;
        }
    });
}

function createPuzzleImg(){
    var c=document.createElement('canvas');c.width=600;c.height=600;
    var ctx=c.getContext('2d');ctx.fillStyle='#6c5ce7';ctx.fillRect(0,0,600,600);
    ctx.fillStyle='white';ctx.font='bold 40px Arial';ctx.textAlign='center';
    for(var i=0;i<9;i++)ctx.fillText(i+1,(i%3)*200+100,Math.floor(i/3)*200+120);
    return c.toDataURL('image/png');
}

function shuffle(){piecesPlaced=0;document.getElementById('piecesLeft').textContent='9';document.getElementById('winScreen').classList.remove('show');pieces.forEach(function(p){p.position.set((Math.random()-0.5)*6,(Math.random()-0.5)*8,Math.random()*3);p.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,0);p.userData.placed=false;});toast('🔀 Embaralhado!');}
function resetPuzzle(){pieces.forEach(function(p){if(p.userData.placed){p.position.set(p.userData.targetX,p.userData.targetY,0);p.rotation.set(0,0,0);}});toast('🔄 Reset');}
function capture(){alert('📸 Tire um print!');}
function closeGame(){location.reload();}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
</script>
</body>
</html>
