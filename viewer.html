<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>3dcam AR</title>
    
    <!-- QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <!-- Model Viewer (Google AR) -->
    <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#000;overflow:hidden;height:100dvh;width:100dvw;position:fixed}
        
        /* TELA 1: Início */
        #startScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14;z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px;color:#fff;text-align:center}
        .icon{font-size:60px;margin-bottom:10px}
        h2{font-size:1.3em;margin-bottom:5px;color:#a29bfe}
        p{opacity:.7;margin-bottom:18px;font-size:.9em;line-height:1.4}
        .btn{display:block;width:100%;max-width:280px;padding:16px;border:none;border-radius:16px;font-size:1.1em;font-weight:600;cursor:pointer;margin:8px auto;color:#fff}
        .btn-start{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
        .btn-start:active{transform:scale(.95)}
        
        /* TELA 2: Scanner */
        #scannerScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;flex-direction:column}
        #scannerScreen.on{display:flex}
        #reader{width:100%!important;height:100%!important;flex:1}
        #reader video{width:100%!important;height:100%!important;object-fit:cover!important}
        #reader img{display:none!important}
        #reader__scan_region,#reader__dashboard_section,#reader__header_message,#html5-qrcode-button-camera-permission,#html5-qrcode-button-camera-start,#html5-qrcode-button-camera-stop{display:none!important}
        
        .scan-bar{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(0,0,0,.8);padding:12px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.8em}
        .scan-dot{width:8px;height:8px;border-radius:50%;background:#f44;animation:pulse 1s infinite}
        .scan-dot.found{background:#0f8;animation:none}
        @keyframes pulse{50%{transform:scale(1.8);opacity:.4}}
        
        .scan-frame{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:500;pointer-events:none}
        .sf-inner{width:200px;height:200px;position:relative}
        .corner{position:absolute;width:25px;height:25px;border-color:#00cec9;border-style:solid}
        .corner.tl{top:0;left:0;border-width:3px 0 0 3px;border-radius:6px 0 0 0}
        .corner.tr{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 6px 0 0}
        .corner.bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 6px}
        .corner.br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 6px 0}
        .scan-line{position:absolute;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#00cec9,transparent);animation:scanUpDown 2s linear infinite}
        @keyframes scanUpDown{0%{top:0}100%{top:100%}}
        
        /* TELA 3: AR Viewer */
        #arScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;flex-direction:column}
        #arScreen.on{display:flex}
        
        model-viewer{width:100%;height:100%;flex:1;--poster-color:transparent;background:#0a0a14}
        
        .ar-bar{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(0,0,0,.8);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.8em}
        .ar-dot{width:8px;height:8px;border-radius:50%;background:#0f8;animation:pulse .8s infinite}
        
        .ar-ctrls{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
        .ctrl{width:44px;height:44px;border-radius:50%;background:rgba(108,92,231,.85);border:none;color:#fff;font-size:1.1em;cursor:pointer}
        .ctrl:active{transform:scale(.9)}
        .ctrl-wide{width:auto;padding:0 16px;border-radius:22px;font-size:.8em;font-weight:600}
        
        .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.9);color:#fff;padding:10px 20px;border-radius:20px;font-size:.8em;z-index:2000;transition:.3s;pointer-events:none;white-space:nowrap}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .flash{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,206,201,.3);z-index:2000;pointer-events:none;display:none}
        .flash.on{display:block;animation:flash .5s ease forwards}
        @keyframes flash{0%{opacity:1}100%{opacity:0}}
    </style>
</head>
<body>

<!-- TELA 1 -->
<div id="startScreen">
    <div class="icon">📸</div>
    <h2>3dcam AR 3D</h2>
    <p>1. Toque em INICIAR<br>2. Aponte para o QR Code<br>3. Veja em 3D e AR!</p>
    <button class="btn btn-start" onclick="startScanner()">📷 INICIAR SCANNER</button>
    <p style="font-size:.7em;opacity:.4;margin-top:15px">Compatível com ARCore e ARKit</p>
</div>

<!-- TELA 2: SCANNER -->
<div id="scannerScreen">
    <div class="scan-bar">
        <span style="display:flex;align-items:center;gap:8px">
            <div class="scan-dot" id="scanDot"></div>
            <span id="scanText">Aponte para o QR Code</span>
        </span>
        <button class="ctrl" onclick="stopScanner()" style="position:static;width:auto;height:auto;border-radius:20px;padding:6px 14px;font-size:.75em">✕</button>
    </div>
    <div id="reader"></div>
    <div class="scan-frame"><div class="sf-inner"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div class="scan-line"></div></div></div>
</div>

<!-- TELA 3: AR 3D -->
<div id="arScreen">
    <div class="ar-bar">
        <span style="display:flex;align-items:center;gap:8px">
            <div class="ar-dot"></div>
            <span>✨ 3D View - Toque "AR" para Realidade Aumentada</span>
        </span>
    </div>
    
    <model-viewer id="mv" 
        camera-controls 
        touch-action="pan-y" 
        ar 
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="auto"
        exposure="1"
        shadow-intensity="0.8"
        environment-image="neutral"
        auto-rotate
        rotation-per-second="30deg"
        style="width:100%;height:100%">
    </model-viewer>
    
    <div class="flash" id="flash"></div>
    
    <div class="ar-ctrls">
        <button class="ctrl" onclick="resetModel()">🔄</button>
        <button class="ctrl" onclick="toggleAutoRotate()">⏯️</button>
        <button class="ctrl ctrl-wide" onclick="enterAR()">📱 Ver em AR</button>
        <button class="ctrl" onclick="closeAR()">✕</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let scanner=null;
let currentImage=null;

// ==================== SCANNER ====================
function startScanner(){
    document.getElementById('startScreen').style.display='none';
    document.getElementById('scannerScreen').classList.add('on');
    
    scanner=new Html5Qrcode("reader");
    scanner.start(
        {facingMode:"environment"},
        {fps:10,qrbox:{width:200,height:200},aspectRatio:1.0},
        onScanSuccess,
        ()=>{} 
    ).then(()=>{
        console.log('✅ Scanner iniciado');
        document.getElementById('scanText').textContent='Aponte para o QR Code na tela do PC';
    }).catch(err=>{
        console.error('Erro:',err);
        alert('Erro ao abrir câmera!\nVerifique as permissões.');
        document.getElementById('startScreen').style.display='flex';
        document.getElementById('scannerScreen').classList.remove('on');
    });
}

function onScanSuccess(decodedText){
    console.log('✅ QR Lido!');
    document.getElementById('scanDot').classList.add('found');
    document.getElementById('scanText').textContent='✅ QR Detectado!';
    if(navigator.vibrate)navigator.vibrate([50,30,50,30,100]);
    
    if(scanner){scanner.stop().catch(()=>{});scanner=null;}
    
    currentImage=localStorage.getItem('currentImage')||localStorage.getItem('finalImage');
    
    setTimeout(()=>{
        document.getElementById('scannerScreen').classList.remove('on');
        startARViewer();
    },400);
}

function stopScanner(){
    if(scanner){scanner.stop().catch(()=>{});scanner=null;}
    document.getElementById('scannerScreen').classList.remove('on');
    document.getElementById('startScreen').style.display='flex';
}

// ==================== AR 3D VIEWER ====================
function startARViewer(){
    document.getElementById('arScreen').classList.add('on');
    document.getElementById('flash').classList.add('on');
    setTimeout(()=>document.getElementById('flash').classList.remove('on'),500);
    
    const mv=document.getElementById('mv');
    const imgSrc=currentImage||createDefaultImg();
    
    // Model Viewer usa GLTF/GLB, então vamos criar um plano 3D com a imagem como textura
    // Usando um GLB inline gerado via Three.js + GLTFExporter simplificado
    // Ou usando uma abordagem mais simples: criar um cartão 3D
    
    // Como Model Viewer precisa de um modelo 3D, vamos criar um usando a API de conversão
    create3DPlaneFromImage(imgSrc,mv);
    
    toast('✨ Modelo 3D carregado! Toque em "Ver em AR"');
}

async function create3DPlaneFromImage(imgSrc,mv){
    // Criar um canvas com a imagem para usar como textura
    const img=new Image();
    img.crossOrigin='anonymous';
    
    img.onload=async function(){
        // Criar um GLB simples com a textura usando Three.js
        const scene=new THREE.Scene();
        const aspect=img.width/img.height;
        const geometry=new THREE.PlaneGeometry(aspect,1);
        
        // Criar canvas com textura
        const canvas=document.createElement('canvas');
        canvas.width=img.width;
        canvas.height=img.height;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0);
        
        // Adicionar efeitos visuais na textura
        ctx.strokeStyle='#6c5ce7';
        ctx.lineWidth=img.width*0.01;
        ctx.strokeRect(0,0,img.width,img.height);
        
        // Brilho nos cantos
        const grd=ctx.createRadialGradient(0,0,0,0,0,img.width*0.1);
        grd.addColorStop(0,'rgba(108,92,231,0.5)');
        grd.addColorStop(1,'rgba(108,92,231,0)');
        ctx.fillStyle=grd;
        ctx.fillRect(0,0,img.width*0.1,img.height*0.1);
        
        const texture=new THREE.CanvasTexture(canvas);
        const material=new THREE.MeshStandardMaterial({
            map:texture,
            side:THREE.DoubleSide,
            roughness:0.3,
            metalness:0.1
        });
        
        const mesh=new THREE.Mesh(geometry,material);
        scene.add(mesh);
        
        // Exportar como GLB
        const exporter=new GLTFExporter();
        exporter.parse(scene,function(glb){
            const blob=new Blob([glb],{type:'model/gltf-binary'});
            const url=URL.createObjectURL(blob);
            mv.src=url;
            console.log('✅ Modelo 3D criado!');
        },{binary:true});
    };
    
    img.onerror=function(){
        // Fallback: usar um GLB de placeholder
        mv.src='https://modelviewer.dev/shared-assets/models/Astronaut.glb';
        console.log('⚠️ Usando modelo placeholder');
    };
    
    img.src=imgSrc;
}

// Incluir Three.js e GLTFExporter
const THREE_CDN='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
const GLTF_CDN='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js';

function loadScript(src){
    return new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src=src;s.onload=resolve;s.onerror=reject;
        document.head.appendChild(s);
    });
}

// Carregar Three.js e GLTFExporter dinamicamente
Promise.all([loadScript(THREE_CDN),loadScript(GLTF_CDN)]).then(()=>{
    console.log('✅ Three.js carregado');
}).catch(err=>{
    console.warn('⚠️ Three.js não carregou, usando fallback');
});

function enterAR(){
    const mv=document.getElementById('mv');
    if(mv&&mv.canActivateAR){
        mv.activateAR().then(()=>{
            console.log('✅ AR Ativado!');
            toast('📱 AR Nativo Ativado!');
        }).catch(err=>{
            console.error('AR não disponível:',err);
            toast('⚠️ AR não disponível neste dispositivo');
        });
    }else{
        toast('⚠️ AR requer Android com ARCore ou iOS com ARKit');
    }
}

function resetModel(){
    const mv=document.getElementById('mv');
    if(mv){mv.cameraOrbit='0deg 75deg 105%';mv.cameraTarget='0m 0m 0m';}
    toast('🔄 View resetada');
}

function toggleAutoRotate(){
    const mv=document.getElementById('mv');
    if(mv){mv.autoRotate=!mv.autoRotate;}
    toast(mv&&mv.autoRotate?'⏯️ Rotação ON':'⏯️ Rotação OFF');
}

function closeAR(){
    document.getElementById('arScreen').classList.remove('on');
    document.getElementById('startScreen').style.display='flex';
    const mv=document.getElementById('mv');
    if(mv)mv.src='';
}

function createDefaultImg(){
    return'data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#6c5ce7"/><stop offset="100%" style="stop-color:#00cec9"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/><text x="400" y="300" text-anchor="middle" fill="white" font-size="40" font-weight="bold">3dcam AR</text></svg>');
}

function toast(m){
    const t=document.getElementById('toast');
    t.textContent=m;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
}

// Limpar ao sair
window.addEventListener('beforeunload',()=>{
    if(scanner)scanner.stop().catch(()=>{});
});
</script>
</body>
</html>
