<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>3dcam AR</title>
    
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#000;overflow:hidden;height:100dvh;width:100dvw;position:fixed}
        
        #startScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14;z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px;color:#fff;text-align:center}
        .icon{font-size:60px;margin-bottom:10px}
        h2{font-size:1.3em;margin-bottom:5px;color:#a29bfe}
        p{opacity:.7;margin-bottom:18px;font-size:.9em;line-height:1.4}
        .btn{display:block;width:100%;max-width:280px;padding:16px;border:none;border-radius:16px;font-size:1.1em;font-weight:600;cursor:pointer;margin:8px auto;color:#fff}
        .btn-start{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
        .btn-start:active{transform:scale(.95)}
        
        #scannerScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;flex-direction:column}
        #scannerScreen.on{display:flex}
        #reader{width:100%!important;height:100%!important;flex:1}
        #reader video{width:100%!important;height:100%!important;object-fit:cover!important}
        #reader__scan_region,#reader__dashboard_section,#html5-qrcode-button-camera-permission,#html5-qrcode-button-camera-start,#html5-qrcode-button-camera-stop{display:none!important}
        
        .scan-bar{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(0,0,0,.8);padding:12px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.8em}
        .scan-dot{width:8px;height:8px;border-radius:50%;background:#f44;animation:pulse 1s infinite}
        .scan-dot.found{background:#0f8;animation:none}
        @keyframes pulse{50%{transform:scale(1.8);opacity:.4}}
        
        .scan-frame{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:500;pointer-events:none}
        .sf-inner{width:200px;height:200px;position:relative}
        .corner{position:absolute;width:25px;height:25px;border-color:#00cec9;border-style:solid}
        .corner.tl{top:0;left:0;border-width:3px 0 0 3px;border-radius:6px 0 0 0}
        .corner.tr{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 6px 0 0}
        .corner.bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 6px}
        .corner.br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 6px 0}
        .scan-line{position:absolute;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#00cec9,transparent);animation:scanUpDown 2s linear infinite}
        @keyframes scanUpDown{0%{top:0}100%{top:100%}}
        
        /* TELA AR 3D */
        #arScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000}
        #arScreen.on{display:flex;flex-direction:column}
        #arCanvas{flex:1;width:100%}
        
        .ar-bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.8);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.8em}
        .ar-dot{width:8px;height:8px;border-radius:50%;background:#0f8;animation:pulse .8s infinite}
        
        .ar-ctrls{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:10px}
        .ctrl{width:44px;height:44px;border-radius:50%;background:rgba(108,92,231,.85);border:none;color:#fff;font-size:1.2em;cursor:pointer}
        .ctrl:active{transform:scale(.9)}
        
        .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.9);color:#fff;padding:10px 20px;border-radius:20px;font-size:.8em;z-index:2000;transition:.3s;pointer-events:none;white-space:nowrap}
        .toast.show{transform:translateX(-50%) translateY(0)}
        
        .flash{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,206,201,.3);z-index:2000;pointer-events:none;display:none}
        .flash.on{display:block;animation:flash .5s ease forwards}
        @keyframes flash{0%{opacity:1}100%{opacity:0}}
    </style>
</head>
<body>

<!-- TELA 1: Início -->
<div id="startScreen">
    <div class="icon">📸</div>
    <h2>3dcam AR 3D</h2>
    <p>1. Clique em INICIAR<br>2. Permita a câmera<br>3. Aponte para o QR Code na tela do PC</p>
    <button class="btn btn-start" onclick="startScanner()">📷 INICIAR SCANNER</button>
</div>

<!-- TELA 2: Scanner QR -->
<div id="scannerScreen">
    <div class="scan-bar">
        <span style="display:flex;align-items:center;gap:8px">
            <div class="scan-dot" id="scanDot"></div>
            <span id="scanText">Aponte para o QR Code</span>
        </span>
        <button class="ctrl" onclick="stopScanner()" style="position:static;width:auto;height:auto;border-radius:20px;padding:6px 14px;font-size:.75em">✕</button>
    </div>
    <div id="reader"></div>
    <div class="scan-frame"><div class="sf-inner"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div class="scan-line"></div></div></div>
</div>

<!-- TELA 3: AR 3D -->
<div id="arScreen">
    <div class="ar-bar">
        <span style="display:flex;align-items:center;gap:8px">
            <div class="ar-dot"></div>
            <span>✨ AR 3D Ativo</span>
        </span>
        <span style="opacity:.5;font-size:.7em">Toque e arraste para girar</span>
    </div>
    <canvas id="arCanvas"></canvas>
    <div class="flash" id="flash"></div>
    <div class="ar-ctrls">
        <button class="ctrl" onclick="resetView()">🔄</button>
        <button class="ctrl" onclick="toggleRotation()">⏯️</button>
        <button class="ctrl" onclick="capture3D()">📸</button>
        <button class="ctrl" onclick="close3D()">✕</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== SCANNER ====================
let scanner=null;
let currentImage=null;
let threeActive=false;

function startScanner(){
    document.getElementById('startScreen').style.display='none';
    document.getElementById('scannerScreen').classList.add('on');
    
    scanner=new Html5Qrcode("reader");
    scanner.start(
        {facingMode:"environment"},
        {fps:10,qrbox:{width:200,height:200},aspectRatio:1.0},
        onScanSuccess,
        ()=>{} // ignora erros
    ).then(()=>{
        console.log('✅ Scanner iniciado');
    }).catch(err=>{
        alert('Erro ao abrir câmera!\nVerifique as permissões do Chrome.');
        document.getElementById('startScreen').style.display='flex';
        document.getElementById('scannerScreen').classList.remove('on');
    });
}

function onScanSuccess(decodedText){
    console.log('✅ QR Detectado!');
    document.getElementById('scanDot').classList.add('found');
    document.getElementById('scanText').textContent='✅ QR Lido!';
    if(navigator.vibrate)navigator.vibrate([50,30,50,30,100]);
    
    if(scanner){scanner.stop().catch(()=>{});}
    
    currentImage=localStorage.getItem('currentImage')||localStorage.getItem('finalImage');
    
    setTimeout(()=>{
        document.getElementById('scannerScreen').classList.remove('on');
        start3DViewer();
    },400);
}

function stopScanner(){
    if(scanner)scanner.stop().catch(()=>{});
    document.getElementById('scannerScreen').classList.remove('on');
    document.getElementById('startScreen').style.display='flex';
}

// ==================== AR 3D ====================
let scene,camera,renderer,mesh,animationId;
let rotating=true;
let textureImage=null;

function start3DViewer(){
    document.getElementById('arScreen').classList.add('on');
    document.getElementById('flash').classList.add('on');
    setTimeout(()=>document.getElementById('flash').classList.remove('on'),500);
    
    const canvas=document.getElementById('arCanvas');
    const w=window.innerWidth;
    const h=window.innerHeight;
    
    // Three.js setup
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0a0a14);
    
    camera=new THREE.PerspectiveCamera(45,w/h,0.1,100);
    camera.position.z=5;
    
    renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
    renderer.setSize(w,h,false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    
    // Iluminação
    const ambient=new THREE.AmbientLight(0xffffff,0.6);
    scene.add(ambient);
    const dir=new THREE.DirectionalLight(0xffffff,0.8);
    dir.position.set(1,1,1);
    scene.add(dir);
    const dir2=new THREE.DirectionalLight(0x6c5ce7,0.5);
    dir2.position.set(-1,-1,-1);
    scene.add(dir2);
    
    // Partículas de fundo
    const particlesGeo=new THREE.BufferGeometry();
    const particlesCount=300;
    const posArray=new Float32Array(particlesCount*3);
    for(let i=0;i<particlesCount*3;i++)posArray[i]=(Math.random()-0.5)*15;
    particlesGeo.setAttribute('position',new THREE.BufferAttribute(posArray,3));
    const particlesMat=new THREE.PointsMaterial({size:0.02,color:0x6c5ce7,transparent:true,opacity:0.6});
    const particles=new THREE.Points(particlesGeo,particlesMat);
    scene.add(particles);
    
    // Carregar textura
    const loader=new THREE.TextureLoader();
    const imgSrc=currentImage||createDefaultImg();
    
    loader.load(imgSrc,function(texture){
        textureImage=texture;
        const aspect=texture.image.width/texture.image.height;
        const geometry=new THREE.PlaneGeometry(aspect*2.5,2.5);
        const material=new THREE.MeshStandardMaterial({
            map:texture,
            side:THREE.DoubleSide,
            roughness:0.3,
            metalness:0.1
        });
        mesh=new THREE.Mesh(geometry,material);
        scene.add(mesh);
        
        // Moldura 3D
        const frameGeo=new THREE.EdgesGeometry(geometry);
        const frameMat=new THREE.LineBasicMaterial({color:0x6c5ce7,linewidth:2});
        const frame=new THREE.LineSegments(frameGeo,frameMat);
        mesh.add(frame);
        
        // Anel orbitante
        const ringGeo=new THREE.TorusGeometry(aspect*1.3,0.03,16,100);
        const ringMat=new THREE.MeshBasicMaterial({color:0x00cec9,transparent:true,opacity:0.5});
        const ring=new THREE.Mesh(ringGeo,ringMat);
        ring.rotation.x=Math.PI/2;
        mesh.add(ring);
        
        console.log('✅ Textura 3D carregada');
    },undefined,function(err){
        console.error('Erro ao carregar textura:',err);
        // Fallback
        const geometry=new THREE.PlaneGeometry(3,2);
        const material=new THREE.MeshBasicMaterial({color:0x6c5ce7});
        mesh=new THREE.Mesh(geometry,material);
        scene.add(mesh);
    });
    
    // Touch para girar
    let isDragging=false,prevX=0,prevY=0;
    canvas.addEventListener('touchstart',e=>{
        isDragging=true;prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;
    });
    canvas.addEventListener('touchmove',e=>{
        if(!isDragging||!mesh)return;
        const dx=e.touches[0].clientX-prevX;
        const dy=e.touches[0].clientY-prevY;
        mesh.rotation.y+=dx*0.01;
        mesh.rotation.x+=dy*0.01;
        prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;
    });
    canvas.addEventListener('touchend',()=>{isDragging=false;});
    
    // Mouse
    canvas.addEventListener('mousedown',e=>{isDragging=true;prevX=e.clientX;prevY=e.clientY;});
    canvas.addEventListener('mousemove',e=>{
        if(!isDragging||!mesh)return;
        mesh.rotation.y+=(e.clientX-prevX)*0.01;
        mesh.rotation.x+=(e.clientY-prevY)*0.01;
        prevX=e.clientX;prevY=e.clientY;
    });
    canvas.addEventListener('mouseup',()=>{isDragging=false;});
    
    threeActive=true;
    animate();
    toast('✨ AR 3D Ativado!');
}

function animate(){
    if(!threeActive)return;
    animationId=requestAnimationFrame(animate);
    
    if(mesh&&rotating){
        mesh.rotation.y+=0.005;
        mesh.position.y=Math.sin(Date.now()*0.001)*0.2;
    }
    
    renderer.render(scene,camera);
}

function resetView(){
    if(mesh){mesh.rotation.set(0,0,0);mesh.position.set(0,0,0);}
    toast('🔄 View resetada');
}

function toggleRotation(){
    rotating=!rotating;
    toast(rotating?'⏯️ Rotação ON':'⏯️ Rotação OFF');
}

function capture3D(){
    if(!threeActive)return;
    renderer.render(scene,camera);
    const data=renderer.domElement.toDataURL('image/png');
    const a=document.createElement('a');
    a.download='3dcam-3d-'+Date.now()+'.png';
    a.href=data;
    a.click();
    toast('📸 Captura 3D salva!');
}

function close3D(){
    threeActive=false;
    if(animationId)cancelAnimationFrame(animationId);
    if(renderer)renderer.dispose();
    document.getElementById('arScreen').classList.remove('on');
    document.getElementById('startScreen').style.display='flex';
}

function createDefaultImg(){
    return'data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#6c5ce7"/><stop offset="100%" style="stop-color:#00cec9"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/><text x="400" y="300" text-anchor="middle" fill="white" font-size="40" font-weight="bold">3dcam 3D</text></svg>');
}

function toast(m){
    const t=document.getElementById('toast');
    t.textContent=m;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
}

window.addEventListener('resize',()=>{
    if(!threeActive)return;
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
