<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>3dcam AR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#000;overflow:hidden;height:100dvh;width:100dvw;position:fixed}
        #start{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14;z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px;color:#fff;text-align:center}
        .icon{font-size:60px;margin-bottom:10px}
        h2{font-size:1.3em;margin-bottom:5px;color:#a29bfe}
        p{opacity:.7;margin-bottom:18px;font-size:.9em}
        .btn{display:block;width:100%;max-width:280px;padding:16px;border:none;border-radius:16px;font-size:1.2em;font-weight:600;cursor:pointer;margin:8px auto;color:#fff}
        .btn-go{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
        .btn-go:active{transform:scale(.95)}
        #ar{display:none;position:fixed;top:0;left:0;width:100%;height:100%}
        #ar.on{display:block}
        .bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.8);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.8em}
        .st{display:flex;align-items:center;gap:6px}
        .dot{width:8px;height:8px;border-radius:50%;background:#f44}
        .dot.on{background:#0f8;animation:pulse .8s infinite}
        @keyframes pulse{50%{transform:scale(1.5)}}
        .ctrl{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:10px}
        .cb{width:44px;height:44px;border-radius:50%;background:rgba(108,92,231,.85);border:none;color:#fff;font-size:1.2em;cursor:pointer}
        .cb:active{transform:scale(.9)}
        .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.9);color:#fff;padding:8px 18px;border-radius:20px;font-size:.75em;z-index:200;transition:.3s;pointer-events:none}
        .toast.show{transform:translateX(-50%) translateY(0)}
        a-scene{position:fixed!important;top:0!important;left:0!important;width:100%!important;height:100%!important;z-index:1!important}
    </style>
</head>
<body>
<div id="start">
    <div class="icon">📸</div>
    <h2>3dcam AR Viewer</h2>
    <p>Aponte a câmera para a foto<br>com o QR Code no canto</p>
    <button class="btn btn-go" onclick="go()">📷 INICIAR AR</button>
</div>

<div id="ar">
    <div class="bar">
        <div class="st"><div class="dot" id="dot"></div><span id="st">Câmera ativa</span></div>
        <span style="opacity:.5;font-size:.7em">Aponte para a foto</span>
    </div>
    <div class="ctrl">
        <button class="cb" onclick="reset()">🔄</button>
        <button class="cb" onclick="cap()">📸</button>
    </div>
    <a-scene id="sc" embedded arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;" renderer="antialias: true; alpha: true; precision: mediump;" vr-mode-ui="enabled: false" loading-screen="enabled: false">
        <a-entity id="ac" visible="false">
            <a-image id="mi" src="" position="0 0 0" rotation="-90 0 0" width="1.6" height="1.2"></a-image>
            <a-entity position="0 0 -0.02" rotation="-90 0 0">
                <a-ring color="#6c5ce7" radius-inner="0.78" radius-outer="0.82" animation="property: rotation; to: 0 0 360; loop: true; dur: 12000; easing: linear;"></a-ring>
            </a-entity>
            <a-entity position="0 0.6 0" particle-system="preset: snow; particleCount: 50; color: #6c5ce7,#00cec9;" id="fx"></a-entity>
        </a-entity>
        <a-entity camera look-controls="enabled: false"></a-entity>
        <a-light type="ambient" color="#fff" intensity="0.7"></a-light>
    </a-scene>
</div>
<div class="toast" id="toast"></div>

<script>
let arOn=false;

function go(){
    document.getElementById('start').style.display='none';
    document.getElementById('ar').classList.add('on');
    
    const img=localStorage.getItem('currentImage')||localStorage.getItem('finalImage');
    document.getElementById('mi').setAttribute('src',img||df());
    
    document.getElementById('sc').addEventListener('loaded',()=>{
        document.getElementById('dot').classList.add('on');
        document.getElementById('st').textContent='Câmera OK - Aponte';
        // Ativar AR automaticamente após 2s
        setTimeout(()=>{
            document.getElementById('ac').setAttribute('visible',true);
            arOn=true;
            document.getElementById('st').textContent='✅ AR Ativo!';
            toast('✨ AR ativado!');
        },2000);
    });
    
    // Também ativa com toque
    document.addEventListener('touchstart',function ta(e){
        if(e.target.tagName!=='BUTTON'&&!arOn){
            document.getElementById('ac').setAttribute('visible',true);
            arOn=true;
            document.getElementById('st').textContent='✅ AR Ativo!';
            toast('✨ AR ativado!');
            document.removeEventListener('touchstart',ta);
        }
    });
}

function df(){return'data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="#6c5ce7"/><text x="400" y="300" text-anchor="middle" fill="white" font-size="38">3dcam</text></svg>');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function reset(){document.getElementById('ac').setAttribute('visible',false);arOn=false;document.getElementById('st').textContent='Reset - Aponte';toast('🔄 Reset');setTimeout(()=>{document.getElementById('ac').setAttribute('visible',true);arOn=true;document.getElementById('st').textContent='✅ AR Ativo!';},1500);}
function cap(){const c=document.querySelector('canvas');if(c){const a=document.createElement('a');a.download='3dcam-'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click();toast('📸 Foto!');}}
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
</body>
</html>
