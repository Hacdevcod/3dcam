<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3dcam Puzzle AR</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;background:#000;overflow:hidden;height:100dvh;width:100dvw;position:fixed;touch-action:manipulation}
        
        #startScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14;z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;color:#fff;text-align:center}
        h2{font-size:1.2em;margin:8px 0;color:#a29bfe}
        p{opacity:.7;margin-bottom:16px;font-size:.85em}
        .btn{display:block;width:100%;max-width:280px;padding:15px;border:none;border-radius:14px;font-size:1.1em;font-weight:600;cursor:pointer;margin:6px auto;color:#fff}
        .btn-go{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
        
        #scanScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;flex-direction:column}
        #scanScreen.on{display:flex}
        #reader{flex:1;width:100%!important;height:100%!important}
        #reader video{width:100%!important;height:100%!important;object-fit:cover!important}
        #reader img,#reader__scan_region,#reader__dashboard_section,#html5-qrcode-button-camera-permission,#html5-qrcode-button-camera-start,#html5-qrcode-button-camera-stop{display:none!important}
        
        .bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.8);padding:8px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.75em}
        .dot{width:7px;height:7px;border-radius:50%;background:#f44;animation:pulse 1s infinite}
        .dot.ok{background:#0f8;animation:none}@keyframes pulse{50%{transform:scale(1.8);opacity:.4}}
        
        #puzzleScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14}
        #puzzleScreen.on{display:block}
        #puzzleCanvas{width:100%!important;height:100%!important;display:block}
        
        .game-bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.85);padding:8px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.75em}
        .score{color:#00cec9;font-weight:700;font-size:1.1em}
        
        .game-ctrls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
        .ctrl{width:40px;height:40px;border-radius:50%;background:rgba(108,92,231,.85);border:none;color:#fff;font-size:1.1em;cursor:pointer}
        .ctrl:active{transform:scale(.9)}
        .ctrl-wide{width:auto;padding:0 16px;border-radius:20px;font-size:.8em;font-weight:700}
        .ctrl-green{background:#00c853;color:#000}
        
        .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.9);color:#fff;padding:8px 18px;border-radius:20px;font-size:.75em;z-index:200;transition:.3s;pointer-events:none}
        .toast.show{transform:translateX(-50%) translateY(0)}
        
        .win-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:500;display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff;text-align:center}
        .win-screen.show{display:flex}
        .win-icon{font-size:70px;animation:bounce .8s infinite}
        @keyframes bounce{50%{transform:translateY(-25px)}}
        
        #arScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:600}
        #arScreen.on{display:flex;flex-direction:column}
        #arVideo{width:100%!important;height:100%!important;object-fit:cover!important;position:fixed;top:0;left:0;z-index:1}
        #arCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2}
    </style>
</head>
<body>

<div id="startScreen">
    <div style="font-size:50px">🧩</div>
    <h2>3dcam Puzzle 3D</h2>
    <p>1. Escaneie o QR Code<br>2. Monte o quebra-cabeça!</p>
    <button class="btn btn-go" onclick="startScan()">📷 ESCANEAR QR</button>
</div>

<div id="scanScreen">
    <div class="bar">
        <span style="display:flex;align-items:center;gap:6px"><div class="dot" id="sd"></div><span id="st">Aponte pro QR Code na tela</span></span>
        <button class="ctrl" onclick="stopScan()" style="position:static;width:auto;height:auto;border-radius:14px;padding:4px 12px;font-size:.7em">✕</button>
    </div>
    <div id="reader"></div>
</div>

<div id="puzzleScreen">
    <canvas id="puzzleCanvas"></canvas>
    <div class="game-bar">
        <span>🧩 Puzzle 3D</span>
        <span>Faltam: <span class="score" id="piecesLeft">9</span></span>
        <span style="opacity:.5;font-size:.65em">Toque na peça + arraste</span>
    </div>
    <div class="game-ctrls">
        <button class="ctrl" onclick="shufflePieces()">🔀</button>
        <button class="ctrl" onclick="resetPuzzle()">🔄</button>
        <button class="ctrl-wide ctrl-green" onclick="startAR()">📱 AR</button>
        <button class="ctrl" onclick="snapPhoto()">📸</button>
        <button class="ctrl" onclick="closePuzzle()">✕</button>
    </div>
    <div class="win-screen" id="winScreen">
        <div class="win-icon">🎉</div>
        <h2 style="color:#00cec9;margin:10px 0">QUEBRA-CABEÇA COMPLETO!</h2>
        <button class="btn btn-go" onclick="shufflePieces()">🔄 JOGAR NOVAMENTE</button>
        <button class="btn" style="background:#00c853;color:#000;margin-top:5px" onclick="startAR()">📱 VER EM AR</button>
    </div>
</div>

<div id="arScreen">
    <video id="arVideo" autoplay playsinline muted></video>
    <canvas id="arCanvas"></canvas>
    <div class="bar"><span style="display:flex;align-items:center;gap:6px"><div style="width:7px;height:7px;border-radius:50%;background:#0f8;animation:pulse .8s infinite"></div><span>📱 AR Mode - Quebra-Cabeça no Mundo Real</span></span></div>
    <div class="game-ctrls">
        <button class="ctrl" onclick="closeAR()">✕</button>
        <button class="ctrl" onclick="snapAR()">📸</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== SCANNER ====================
var scanner=null;
function startScan(){
    document.getElementById('startScreen').style.display='none';
    document.getElementById('scanScreen').classList.add('on');
    scanner=new Html5Qrcode("reader");
    scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:180,height:180},aspectRatio:1.0},
        function(t){
            document.getElementById('sd').classList.add('ok');
            document.getElementById('st').textContent='✅ Lido! Criando puzzle...';
            if(navigator.vibrate)navigator.vibrate([50,30,100]);
            if(scanner){scanner.stop().catch(function(){});scanner=null;}
            setTimeout(function(){document.getElementById('scanScreen').classList.remove('on');initPuzzle();},400);
        },function(){}
    ).catch(function(){alert('Erro: Permita a câmera!\nChrome > Configurações > Site > Câmera');document.getElementById('startScreen').style.display='flex';});
}
function stopScan(){if(scanner){scanner.stop().catch(function(){});scanner=null;}document.getElementById('scanScreen').classList.remove('on');document.getElementById('startScreen').style.display='flex';}

// ==================== PUZZLE 3D ====================
var scene,camera,renderer,pieces=[],selectedPiece=null,animId;
var totalPieces=9,piecesPlaced=0,imgUrl=null;
var raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
var dragging=false;

function initPuzzle(){
    document.getElementById('puzzleScreen').classList.add('on');
    piecesPlaced=0;document.getElementById('piecesLeft').textContent='9';
    pieces=[];selectedPiece=null;
    
    var canvas=document.getElementById('puzzleCanvas');
    var W=window.innerWidth,H=window.innerHeight;
    canvas.width=W;canvas.height=H;
    
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0a0a14);
    
    camera=new THREE.PerspectiveCamera(50,W/H,0.1,100);
    camera.position.set(0,0,7);
    
    renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
    renderer.setSize(W,H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    
    // Iluminação
    scene.add(new THREE.AmbientLight(0xffffff,0.7));
    var l1=new THREE.DirectionalLight(0xffffff,1);l1.position.set(3,5,5);scene.add(l1);
    var l2=new THREE.DirectionalLight(0x6c5ce7,0.4);l2.position.set(-3,1,3);scene.add(l2);
    
    // Grade guia
    for(var i=0;i<=3;i++){
        var pos=-1.65+i*1.1;
        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(pos,-1.65,0),new THREE.Vector3(pos,1.65,0)]),new THREE.LineBasicMaterial({color:0x333355})));
        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-1.65,pos,0),new THREE.Vector3(1.65,pos,0)]),new THREE.LineBasicMaterial({color:0x333355})));
    }
    
    // Carregar imagem e criar peças
    var img=localStorage.getItem('currentImage')||localStorage.getItem('finalImage');
    if(img&&img.length>500){imgUrl=img;loadTextureAndBuild(img);return;}
    var last=localStorage.getItem('lastUploadedImage');
    if(last){testAndBuild(last);return;}
    fetch('https://api.github.com/repos/Hacdevcod/3dcam/contents/images')
    .then(function(r){return r.json();})
    .then(function(f){if(Array.isArray(f)&&f.length>0)testAndBuild('https://raw.githubusercontent.com/Hacdevcod/3dcam/main/images/'+f[f.length-1].name);else buildPieces(null);})
    .catch(function(){buildPieces(null);});
}
function testAndBuild(u){imgUrl=u;var t=new Image();t.crossOrigin='anonymous';t.onload=function(){loadTextureAndBuild(u);};t.onerror=function(){buildPieces(null);};t.src=u;}
function loadTextureAndBuild(src){var loader=new THREE.TextureLoader();loader.crossOrigin='anonymous';loader.load(src,function(tex){buildPieces(tex);},undefined,function(){buildPieces(null);});}

function buildPieces(tex){
    if(!tex)tex=new THREE.CanvasTexture(createDefaultImg());
    
    for(var row=0;row<3;row++){
        for(var col=0;col<3;col++){
            var pieceTex=tex.clone();
            pieceTex.repeat.set(1/3,1/3);
            pieceTex.offset.set(col/3,row/3);
            pieceTex.needsUpdate=true;
            
            var geo=new THREE.PlaneGeometry(1,1);
            var mat=new THREE.MeshStandardMaterial({map:pieceTex,roughness:0.3,metalness:0.1,side:THREE.DoubleSide});
            var piece=new THREE.Mesh(geo,mat);
            
            piece.userData={targetX:(col-1)*1.1,targetY:(1-row)*1.1,targetZ:0,placed:false,row:row,col:col};
            piece.position.set((Math.random()-0.5)*7,(Math.random()-0.5)*9,Math.random()*4);
            piece.rotation.set(Math.random()*Math.PI*0.5,Math.random()*Math.PI*0.5,0);
            
            piece.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0x6c5ce7})));
            scene.add(piece);
            pieces.push(piece);
        }
    }
    toast('🧩 Arraste as peças para montar!');
    setupTouch();
    animate();
}

function createDefaultImg(){
    var c=document.createElement('canvas');c.width=600;c.height=600;
    var ctx=c.getContext('2d');
    var g=ctx.createLinearGradient(0,0,600,600);g.addColorStop(0,'#6c5ce7');g.addColorStop(1,'#00cec9');
    ctx.fillStyle=g;ctx.fillRect(0,0,600,600);
    ctx.fillStyle='white';ctx.font='bold 30px Arial';ctx.textAlign='center';
    for(var i=0;i<9;i++){ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.strokeRect((i%3)*200,(Math.floor(i/3))*200,200,200);ctx.fillText(i+1,(i%3)*200+100,(Math.floor(i/3))*200+120);}
    return c.toDataURL('image/png');
}

// ==================== TOUCH ====================
function setupTouch(){
    var canvas=document.getElementById('puzzleCanvas');
    
    canvas.addEventListener('touchstart',function(e){
        e.preventDefault();
        var touch=e.touches[0];
        mouse.x=(touch.clientX/window.innerWidth)*2-1;
        mouse.y=-(touch.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse,camera);
        var hits=raycaster.intersectObjects(pieces);
        if(hits.length>0){selectedPiece=hits[0].object;selectedPiece.material.emissive=new THREE.Color(0x333333);dragging=true;selectedPiece.position.z=0.8;}
    },{passive:false});
    
    canvas.addEventListener('touchmove',function(e){
        e.preventDefault();
        if(!dragging||!selectedPiece)return;
        var touch=e.touches[0];
        mouse.x=(touch.clientX/window.innerWidth)*2-1;
        mouse.y=-(touch.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse,camera);
        var plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
        var point=new THREE.Vector3();raycaster.ray.intersectPlane(plane,point);
        if(point){selectedPiece.position.x=point.x;selectedPiece.position.y=point.y;selectedPiece.rotation.set(0,0,0);}
    },{passive:false});
    
    canvas.addEventListener('touchend',function(){
        if(selectedPiece){
            selectedPiece.material.emissive=new THREE.Color(0x000000);
            var tx=selectedPiece.userData.targetX,ty=selectedPiece.userData.targetY;
            if(Math.abs(selectedPiece.position.x-tx)<0.5&&Math.abs(selectedPiece.position.y-ty)<0.5){
                selectedPiece.position.set(tx,ty,0);
                selectedPiece.userData.placed=true;
                piecesPlaced++;
                document.getElementById('piecesLeft').textContent=totalPieces-piecesPlaced;
                if(navigator.vibrate)navigator.vibrate(30);
                selectedPiece.material.emissive=new THREE.Color(0x00ff88);
                setTimeout(function(){selectedPiece.material.emissive=new THREE.Color(0x000000);},300);
                if(piecesPlaced>=totalPieces){setTimeout(function(){document.getElementById('winScreen').classList.add('show');if(navigator.vibrate)navigator.vibrate([50,30,50,30,100]);},500);}
                toast('✅ '+piecesPlaced+'/'+totalPieces);
            }
            selectedPiece=null;dragging=false;
        }
    });
    
    // Mouse
    canvas.addEventListener('mousedown',function(e){mouse.x=(e.clientX/window.innerWidth)*2-1;mouse.y=-(e.clientY/window.innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);var hits=raycaster.intersectObjects(pieces);if(hits.length>0){selectedPiece=hits[0].object;selectedPiece.material.emissive=new THREE.Color(0x333333);dragging=true;selectedPiece.position.z=0.8;}});
    canvas.addEventListener('mousemove',function(e){if(!dragging||!selectedPiece)return;mouse.x=(e.clientX/window.innerWidth)*2-1;mouse.y=-(e.clientY/window.innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);var plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);var point=new THREE.Vector3();raycaster.ray.intersectPlane(plane,point);if(point){selectedPiece.position.x=point.x;selectedPiece.position.y=point.y;selectedPiece.rotation.set(0,0,0);}});
    canvas.addEventListener('mouseup',function(){if(selectedPiece){selectedPiece.material.emissive=new THREE.Color(0x000000);var tx=selectedPiece.userData.targetX,ty=selectedPiece.userData.targetY;if(Math.abs(selectedPiece.position.x-tx)<0.5&&Math.abs(selectedPiece.position.y-ty)<0.5){selectedPiece.position.set(tx,ty,0);selectedPiece.userData.placed=true;piecesPlaced++;document.getElementById('piecesLeft').textContent=totalPieces-piecesPlaced;selectedPiece.material.emissive=new THREE.Color(0x00ff88);setTimeout(function(){selectedPiece.material.emissive=new THREE.Color(0x000000);},300);if(piecesPlaced>=totalPieces)document.getElementById('winScreen').classList.add('show');}selectedPiece=null;dragging=false;}});
}

function animate(){
    animId=requestAnimationFrame(animate);
    pieces.forEach(function(p){if(!p.userData.placed&&p!==selectedPiece){p.rotation.z+=0.002;p.position.z=Math.sin(Date.now()*0.001+p.position.x)*0.3;}});
    if(renderer&&scene&&camera)renderer.render(scene,camera);
}

// ==================== CONTROLES ====================
function shufflePieces(){
    piecesPlaced=0;document.getElementById('piecesLeft').textContent='9';
    document.getElementById('winScreen').classList.remove('show');
    pieces.forEach(function(p){p.position.set((Math.random()-0.5)*7,(Math.random()-0.5)*9,Math.random()*4);p.rotation.set(Math.random()*Math.PI*0.5,Math.random()*Math.PI*0.5,0);p.userData.placed=false;});
    toast('🔀 Embaralhado!');
}
function resetPuzzle(){pieces.forEach(function(p){if(p.userData.placed){p.position.set(p.userData.targetX,p.userData.targetY,0);p.rotation.set(0,0,0);}});toast('🔄 Reset');}
function snapPhoto(){if(!renderer)return;renderer.render(scene,camera);var a=document.createElement('a');a.download='puzzle-'+Date.now()+'.png';a.href=renderer.domElement.toDataURL('image/png');a.click();toast('📸 Foto!');}
function closePuzzle(){if(animId)cancelAnimationFrame(animId);if(renderer)renderer.dispose();scene=null;pieces=[];renderer=null;document.getElementById('puzzleScreen').classList.remove('on');document.getElementById('startScreen').style.display='flex';}

// ==================== AR MODE ====================
var arStream=null,arScene,arCamera,arRenderer,arPieces=[],arAnimId;
async function startAR(){
    document.getElementById('puzzleScreen').classList.remove('on');if(animId)cancelAnimationFrame(animId);
    document.getElementById('winScreen').classList.remove('show');
    document.getElementById('arScreen').classList.add('on');
    
    var video=document.getElementById('arVideo');var canvas=document.getElementById('arCanvas');
    canvas.width=window.innerWidth;canvas.height=window.innerHeight;
    
    try{
        arStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});
        video.srcObject=arStream;video.play();
        
        arScene=new THREE.Scene();arCamera=new THREE.PerspectiveCamera(50,canvas.width/canvas.height,0.1,100);arCamera.position.set(0,0,5);
        arRenderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});arRenderer.setSize(canvas.width,canvas.height);
        arScene.add(new THREE.AmbientLight(0xffffff,1));var l=new THREE.DirectionalLight(0xffffff,1.2);l.position.set(2,4,3);arScene.add(l);
        
        arPieces=[];pieces.forEach(function(p){var c=p.clone(true);c.material=p.material.clone();c.position.copy(p.position);c.scale.set(1.5,1.5,1.5);arPieces.push(c);arScene.add(c);});
        
        function arLoop(){if(!arStream)return;arAnimId=requestAnimationFrame(arLoop);arPieces.forEach(function(p){p.rotation.y+=0.005;});arRenderer.render(arScene,arCamera);}
        arLoop();toast('📱 AR Mode!');
    }catch(e){alert('Erro câmera: '+e.message);closeAR();}
}
function closeAR(){if(arStream){arStream.getTracks().forEach(function(t){t.stop();});arStream=null;}if(arAnimId)cancelAnimationFrame(arAnimId);if(arRenderer)arRenderer.dispose();arScene=null;arPieces=[];document.getElementById('arScreen').classList.remove('on');document.getElementById('puzzleScreen').classList.add('on');animate();}
function snapAR(){var v=document.getElementById('arVideo');var c=document.getElementById('arCanvas');var fc=document.createElement('canvas');fc.width=window.innerWidth;fc.height=window.innerHeight;var ctx=fc.getContext('2d');ctx.drawImage(v,0,0,fc.width,fc.height);ctx.drawImage(c,0,0);var a=document.createElement('a');a.download='ar-puzzle-'+Date.now()+'.png';a.href=fc.toDataURL('image/png');a.click();toast('📸 AR!');}

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
window.addEventListener('resize',function(){if(renderer&&camera){var W=window.innerWidth,H=window.innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);}});
</script>
</body>
</html>
