<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>3dcam AR 3D</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;background:#000;overflow:hidden;height:100dvh;width:100dvw;position:fixed}
        #start{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14;z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px;color:#fff;text-align:center}
        h2{font-size:1.2em;margin-bottom:8px;color:#a29bfe}
        .btn{display:block;width:100%;max-width:280px;padding:15px;border:none;border-radius:14px;font-size:1.1em;font-weight:600;cursor:pointer;margin:8px auto;color:#fff}
        .btn-go{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
        .btn-ar{background:linear-gradient(135deg,#00c853,#00e676);font-size:1.2em}
        #scan{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000}
        #scan.on{display:flex;flex-direction:column}
        #reader{flex:1;width:100%!important;height:100%!important}
        #reader video{width:100%!important;height:100%!important;object-fit:cover!important}
        #reader img,#reader__scan_region,#reader__dashboard_section,#html5-qrcode-button-camera-permission,#html5-qrcode-button-camera-start,#html5-qrcode-button-camera-stop{display:none!important}
        .bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.8);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.78em}
        .dot{width:7px;height:7px;border-radius:50%;background:#f44;animation:pulse 1s infinite}
        .dot.ok{background:#0f8;animation:none}@keyframes pulse{50%{transform:scale(1.8);opacity:.4}}
        #ar3D{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14}
        #ar3D.on{display:block}
        #c3d{width:100%!important;height:100%!important;display:block}
        .ctrls{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
        .ctrl{width:40px;height:40px;border-radius:50%;background:rgba(108,92,231,.85);border:none;color:#fff;font-size:1.1em;cursor:pointer}
        .ctrl-ar{width:auto;padding:0 20px;border-radius:22px;background:linear-gradient(135deg,#00c853,#00e676);color:#000;font-weight:700;font-size:.9em}
        #arMode{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:500}
        #arMode.on{display:flex;flex-direction:column}
        #arVideo{width:100%!important;height:100%!important;object-fit:cover!important;position:fixed;top:0;left:0;z-index:1}
        #cAR{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2}
        .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.9);color:#fff;padding:8px 18px;border-radius:20px;font-size:.75em;z-index:200;transition:.3s;pointer-events:none}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .load{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:300;color:#fff;text-align:center;display:none}
        .load.show{display:block}
        .spin{width:35px;height:35px;border:3px solid rgba(108,92,231,.2);border-top-color:#00cec9;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>

<div id="start"><div style="font-size:55px;margin-bottom:8px">📸</div><h2>3dcam 3D</h2><p style="opacity:.7;margin-bottom:16px;font-size:.85em">QR Code → Modelo 3D Real</p><button class="btn btn-go" onclick="startScan()">📷 INICIAR</button></div>

<div id="scan"><div class="bar"><span style="display:flex;align-items:center;gap:6px"><div class="dot" id="sd"></div><span id="st">Aponte pro QR Code</span></span><button class="ctrl" onclick="stopScan()" style="position:static;width:auto;height:auto;border-radius:16px;padding:5px 12px;font-size:.7em">✕</button></div><div id="reader"></div></div>

<div id="ar3D"><div class="load show" id="ld"><div class="spin"></div><p id="lt">Gerando malha 3D...</p></div><canvas id="c3d"></canvas><div class="bar"><span style="display:flex;align-items:center;gap:6px"><div style="width:7px;height:7px;border-radius:50%;background:#0f8"></div><span>✨ Modelo 3D - Arraste</span></span></div><div class="ctrls"><button class="ctrl" onclick="rst()">🔄</button><button class="ctrl" onclick="tsp()">⏯️</button><button class="ctrl-ar" onclick="arMode()">📱 AR</button><button class="ctrl" onclick="pic()">📸</button><button class="ctrl" onclick="cls()">✕</button></div></div>

<div id="arMode"><video id="arVideo" autoplay playsinline muted></video><canvas id="cAR"></canvas><div class="bar"><span style="display:flex;align-items:center;gap:6px"><div style="width:7px;height:7px;border-radius:50%;background:#0f8;animation:pulse .8s infinite"></div><span>📱 AR - Modelo 3D no ambiente</span></span></div><div class="ctrls"><button class="ctrl" onclick="stopAR()">✕</button><button class="ctrl" onclick="picAR()">📸</button></div></div>

<div class="toast" id="toast"></div>

<script>
var scanner,s3,c3,r3,mesh,aid;
var spin=true,imgUrl=null,arS=null;
var aS,aC,aR,aM,aA;

// SCANNER
function startScan(){
    document.getElementById('start').style.display='none';
    document.getElementById('scan').classList.add('on');
    scanner=new Html5Qrcode("reader");
    scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:180,height:180},aspectRatio:1.0},
        function(t){
            document.getElementById('sd').classList.add('ok');
            document.getElementById('st').textContent='✅ Lido!';
            if(navigator.vibrate)navigator.vibrate([50,30,100]);
            if(scanner){scanner.stop().catch(function(){});scanner=null;}
            setTimeout(function(){document.getElementById('scan').classList.remove('on');loadImg();},400);
        },function(){}
    ).catch(function(){alert('Permita a câmera!');document.getElementById('start').style.display='flex';});
}
function stopScan(){if(scanner){scanner.stop().catch(function(){});scanner=null;}document.getElementById('scan').classList.remove('on');document.getElementById('start').style.display='flex';}

// CARREGAR
function loadImg(){
    document.getElementById('ar3D').classList.add('on');
    document.getElementById('ld').classList.add('show');
    document.getElementById('lt').textContent='Analisando imagem...';
    var img=localStorage.getItem('currentImage')||localStorage.getItem('finalImage');
    if(img&&img.length>500&&img.startsWith('data:image')){imgUrl=img;init3D(img);return;}
    var last=localStorage.getItem('lastUploadedImage');
    if(last){testIt(last);return;}
    fetch('https://api.github.com/repos/Hacdevcod/3dcam/contents/images')
    .then(function(r){return r.json();})
    .then(function(f){
        if(Array.isArray(f)&&f.length>0){
            testIt('https://raw.githubusercontent.com/Hacdevcod/3dcam/main/images/'+f[f.length-1].name);
        }else{init3D(null);}
    }).catch(function(){init3D(null);});
}
function testIt(u){imgUrl=u;var t=new Image();t.crossOrigin='anonymous';t.onload=function(){init3D(u);};t.onerror=function(){init3D(null);};t.src=u;}

// ==================== MALHA 3D (TIPO IMPRESSORA 3D) ====================
function init3D(src){
    var c=document.getElementById('c3d');
    var W=window.innerWidth,H=window.innerHeight;
    c.width=W;c.height=H;
    
    s3=new THREE.Scene();
    s3.background=new THREE.Color(0x0a0a14);
    s3.fog=new THREE.Fog(0x0a0a14,5,15);
    
    c3=new THREE.PerspectiveCamera(45,W/H,0.1,100);
    c3.position.set(0,0.3,5);
    
    r3=new THREE.WebGLRenderer({canvas:c,antialias:true});
    r3.setSize(W,H);r3.setPixelRatio(Math.min(window.devicePixelRatio,2));
    r3.shadowMap.enabled=true;
    
    s3.add(new THREE.AmbientLight(0x404060,0.4));
    var k=new THREE.DirectionalLight(0xffeedd,1.2);k.position.set(3,5,5);k.castShadow=true;s3.add(k);
    var f=new THREE.DirectionalLight(0x6c5ce7,0.5);f.position.set(-3,1,2);s3.add(f);
    var r=new THREE.DirectionalLight(0x00cec9,0.6);r.position.set(0,-1,-2);s3.add(r);
    
    // Chão
    var fl=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x111122,roughness:0.1,metalness:0.8}));
    fl.rotation.x=-Math.PI/2;fl.position.y=-3;fl.receiveShadow=true;s3.add(fl);
    
    // Partículas
    var pg=new THREE.BufferGeometry();var pc=500,ps=new Float32Array(pc*3);
    for(var i=0;i<pc*3;i++)ps[i]=(Math.random()-0.5)*10;
    pg.setAttribute('position',new THREE.BufferAttribute(ps,3));
    s3.add(new THREE.Points(pg,new THREE.PointsMaterial({size:0.03,color:0x6c5ce7,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending})));
    
    var fs=src||createFB();
    var ld=new THREE.TextureLoader();ld.crossOrigin='anonymous';
    
    ld.load(fs,function(tex){
        document.getElementById('lt').textContent='Gerando malha 3D (Height Map)...';
        setTimeout(function(){
            var meshData=build3DMesh(tex);
            document.getElementById('ld').classList.remove('show');
            toast('✨ Malha 3D pronta!');
        },300);
    },undefined,function(){initFB();});
    
    setupTouch3D(c);
    anim3D();
}

function build3DMesh(tex){
    var img=tex.image;
    var c=document.createElement('canvas');
    c.width=img.width;c.height=img.height;
    var ctx=c.getContext('2d');
    ctx.drawImage(img,0,0);
    var data=ctx.getImageData(0,0,c.width,c.height).data;
    
    // Resolução da malha (como slicer de impressora 3D)
    var resX=80,resY=80;
    var aspect=img.width/img.height;
    var w=aspect*3,h=3;
    
    // Criar geometria com height map
    var geo=new THREE.PlaneGeometry(w,h,resX-1,resY-1);
    var pos=geo.attributes.position;
    
    // Aplicar height map (Z = altura baseada na luminância)
    for(var i=0;i<pos.count;i++){
        var x=pos.getX(i)/w+0.5;
        var y=pos.getY(i)/h+0.5;
        var sx=Math.floor(x*img.width);
        var sy=Math.floor(y*img.height);
        var idx=(Math.min(sy,img.height-1)*img.width+Math.min(sx,img.width-1))*4;
        var r2=data[idx],g2=data[idx+1],b2=data[idx+2];
        var lum=(0.299*r2+0.587*g2+0.114*b2)/255;
        
        // Altura: partes claras = mais alto (como impressora 3D)
        var height=lum*0.6;
        pos.setZ(i,height);
    }
    geo.computeVertexNormals();
    geo.attributes.position.needsUpdate=true;
    
    // Material com a textura
    var mat=new THREE.MeshStandardMaterial({
        map:tex,
        roughness:0.35,
        metalness:0.05,
        side:THREE.DoubleSide,
        flatShading:false
    });
    
    if(mesh)s3.remove(mesh);
    mesh=new THREE.Mesh(geo,mat);
    mesh.castShadow=true;mesh.receiveShadow=true;
    s3.add(mesh);
    
    // Wireframe opcional (mostra a malha como impressora 3D)
    var wire=new THREE.LineSegments(
        new THREE.WireframeGeometry(geo),
        new THREE.LineBasicMaterial({color:0x6c5ce7,transparent:true,opacity:0.15})
    );
    mesh.add(wire);
    
    // Moldura 3D
    var fg=new THREE.BoxGeometry(w+0.15,h+0.15,0.08);
    var fm=new THREE.MeshStandardMaterial({color:0x6c5ce7,roughness:0.2,metalness:0.9,emissive:0x1a1a3e,emissiveIntensity:0.5});
    var frame=new THREE.Mesh(fg,fm);
    frame.position.z=-0.05;
    mesh.add(frame);
}

function createFB(){var c=document.createElement('canvas');c.width=600;c.height=400;var ctx=c.getContext('2d');var g=ctx.createLinearGradient(0,0,600,400);g.addColorStop(0,'#6c5ce7');g.addColorStop(1,'#00cec9');ctx.fillStyle=g;ctx.fillRect(0,0,600,400);ctx.fillStyle='white';ctx.font='bold 28px Arial';ctx.textAlign='center';ctx.fillText('3dcam',300,170);return c.toDataURL('image/png');}
function initFB(){var g=new THREE.PlaneGeometry(3,2);mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x6c5ce7}));s3.add(mesh);document.getElementById('ld').classList.remove('show');}

function setupTouch3D(c){
    var d=false,px=0,py=0,ld2=0;
    c.addEventListener('touchstart',function(e){e.preventDefault();if(e.touches.length===1){d=true;px=e.touches[0].clientX;py=e.touches[0].clientY;}if(e.touches.length===2)ld2=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:false});
    c.addEventListener('touchmove',function(e){e.preventDefault();if(e.touches.length===1&&d&&mesh){mesh.rotation.y+=(e.touches[0].clientX-px)*0.01;mesh.rotation.x+=(e.touches[0].clientY-py)*0.01;px=e.touches[0].clientX;py=e.touches[0].clientY;}if(e.touches.length===2&&mesh){var dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);c3.position.z-=(dist-ld2)*0.02;c3.position.z=Math.max(2,Math.min(10,c3.position.z));ld2=dist;}},{passive:false});
    c.addEventListener('touchend',function(){d=false;});
    c.addEventListener('mousedown',function(e){d=true;px=e.clientX;py=e.clientY;});
    c.addEventListener('mousemove',function(e){if(!d||!mesh)return;mesh.rotation.y+=(e.clientX-px)*0.01;mesh.rotation.x+=(e.clientY-py)*0.01;px=e.clientX;py=e.clientY;});
    c.addEventListener('mouseup',function(){d=false;});
}

function anim3D(){
    aid=requestAnimationFrame(anim3D);
    if(mesh&&spin){mesh.rotation.y+=0.004;mesh.position.y=Math.sin(Date.now()*0.0008)*0.1;}
    if(r3&&s3&&c3)r3.render(s3,c3);
}

// AR MODE
async function arMode(){
    document.getElementById('ar3D').classList.remove('on');
    if(aid)cancelAnimationFrame(aid);
    document.getElementById('arMode').classList.add('on');
    var v=document.getElementById('arVideo');
    var ca=document.getElementById('cAR');
    ca.width=window.innerWidth;ca.height=window.innerHeight;
    try{
        arS=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});
        v.srcObject=arS;v.play();
        aS=new THREE.Scene();
        aC=new THREE.PerspectiveCamera(50,ca.width/ca.height,0.1,100);
        aC.position.set(0,0.2,4);
        aR=new THREE.WebGLRenderer({canvas:ca,alpha:true,antialias:true});
        aR.setSize(ca.width,ca.height);
        aS.add(new THREE.AmbientLight(0xffffff,0.9));
        var l=new THREE.DirectionalLight(0xffffff,1);l.position.set(2,3,3);aS.add(l);
        if(mesh){aM=mesh.clone();aM.material=mesh.material.clone();aM.position.set(0,0,0);aM.scale.set(1.6,1.6,1.6);aS.add(aM);}
        (function arAnim(){if(!arS)return;aA=requestAnimationFrame(arAnim);if(aM){aM.rotation.y+=0.008;aM.position.y=Math.sin(Date.now()*0.001)*0.1;}if(aR&&aS&&aC)aR.render(aS,aC);})();
        toast('📱 AR 3D Real!');
    }catch(e){alert('Erro câmera: '+e.message);document.getElementById('arMode').classList.remove('on');document.getElementById('ar3D').classList.add('on');anim3D();}
}
function stopAR(){if(arS){arS.getTracks().forEach(function(t){t.stop();});arS=null;}if(aA)cancelAnimationFrame(aA);if(aR)aR.dispose();aS=null;aM=null;document.getElementById('arMode').classList.remove('on');document.getElementById('ar3D').classList.add('on');anim3D();toast('Voltando 3D');}
function picAR(){var v=document.getElementById('arVideo');var ca=document.getElementById('cAR');var c2=document.createElement('canvas');c2.width=window.innerWidth;c2.height=window.innerHeight;var ctx=c2.getContext('2d');ctx.drawImage(v,0,0,c2.width,c2.height);ctx.drawImage(ca,0,0);var a=document.createElement('a');a.download='3dcam-ar-'+Date.now()+'.png';a.href=c2.toDataURL('image/png');a.click();toast('📸 Foto AR!');}

// CONTROLES
function rst(){if(mesh)mesh.rotation.set(0,0,0);c3.position.set(0,0.3,5);toast('🔄 Reset');}
function tsp(){spin=!spin;toast(spin?'▶️ Girando':'⏸️ Pausado');}
function pic(){if(!r3)return;r3.render(s3,c3);var a=document.createElement('a');a.download='3dcam-'+Date.now()+'.png';a.href=r3.domElement.toDataURL('image/png');a.click();toast('📸 Foto!');}
function cls(){if(aid)cancelAnimationFrame(aid);if(r3)r3.dispose();s3=null;mesh=null;r3=null;document.getElementById('ar3D').classList.remove('on');document.getElementById('start').style.display='flex';spin=true;}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
window.addEventListener('resize',function(){if(r3&&c3){var W=window.innerWidth,H=window.innerHeight;c3.aspect=W/H;c3.updateProjectionMatrix();r3.setSize(W,H);}});
</script>
</body>
</html>
