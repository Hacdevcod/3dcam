<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>3dcam - Quebra-Cabeça AR</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;background:#000;overflow:hidden;height:100dvh;width:100dvw;position:fixed;touch-action:manipulation}
        
        #startScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14;z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px;color:#fff;text-align:center}
        h2{font-size:1.3em;margin-bottom:8px;background:linear-gradient(135deg,#6c5ce7,#00cec9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .btn{display:block;width:100%;max-width:280px;padding:16px;border:none;border-radius:16px;font-size:1.2em;font-weight:700;cursor:pointer;margin:10px auto;color:#fff}
        .btn-go{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
        
        #scanScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;flex-direction:column}
        #scanScreen.on{display:flex}
        #reader{flex:1;width:100%!important}
        #reader video{width:100%!important;height:100%!important;object-fit:cover!important}
        #reader img,#reader__scan_region,#reader__dashboard_section,#html5-qrcode-button-camera-permission,#html5-qrcode-button-camera-start,#html5-qrcode-button-camera-stop{display:none!important}
        
        .bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.8);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.8em}
        .dot{width:8px;height:8px;border-radius:50%;background:#f44;animation:pulse 1s infinite}
        .dot.ok{background:#0f8;animation:none}@keyframes pulse{50%{transform:scale(1.8);opacity:.4}}
        
        #gameScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14}
        #gameScreen.on{display:flex;flex-direction:column}
        #gameCanvas{flex:1;width:100%!important;height:100%!important}
        
        .game-bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.85);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.8em}
        .score{display:flex;align-items:center;gap:8px}
        .score-val{color:#00cec9;font-weight:700;font-size:1.1em}
        
        .game-ctrls{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
        .ctrl{width:44px;height:44px;border-radius:50%;background:rgba(108,92,231,.85);border:none;color:#fff;font-size:1.2em;cursor:pointer}
        .ctrl:active{transform:scale(.9)}
        .ctrl-wide{width:auto;padding:0 20px;border-radius:22px;font-size:.85em;font-weight:700}
        .ctrl-green{background:#00c853;color:#000}
        .ctrl-blue{background:#4285f4}
        
        .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.9);color:#fff;padding:10px 22px;border-radius:25px;font-size:.8em;z-index:200;transition:.3s;pointer-events:none;white-space:nowrap}
        .toast.show{transform:translateX(-50%) translateY(0)}
        
        .win-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:500;display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff;text-align:center}
        .win-screen.show{display:flex}
        .win-icon{font-size:80px;animation:bounce 1s infinite}
        @keyframes bounce{50%{transform:translateY(-20px)}}
        
        #arScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:600}
        #arScreen.on{display:flex;flex-direction:column}
        #arVideo{width:100%!important;height:100%!important;object-fit:cover!important;position:fixed;top:0;left:0;z-index:1}
        #arCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2}
    </style>
</head>
<body>

<!-- TELA INICIAL -->
<div id="startScreen">
    <div style="font-size:60px;margin-bottom:10px">🧩</div>
    <h2>3dcam Puzzle AR</h2>
    <p style="opacity:.7;margin-bottom:20px;font-size:.9em;line-height:1.4">Escaneie o QR Code<br>Monte o quebra-cabeça 3D!</p>
    <button class="btn btn-go" onclick="startScan()">📷 ESCANEAR QR</button>
</div>

<!-- SCANNER -->
<div id="scanScreen">
    <div class="bar">
        <span style="display:flex;align-items:center;gap:8px"><div class="dot" id="sd"></div><span id="st">Aponte para o QR Code</span></span>
        <button class="ctrl" onclick="stopScan()" style="position:static;width:auto;height:auto;border-radius:16px;padding:5px 14px;font-size:.75em">✕</button>
    </div>
    <div id="reader"></div>
</div>

<!-- JOGO -->
<div id="gameScreen">
    <canvas id="gameCanvas"></canvas>
    <div class="game-bar">
        <span>🧩 Quebra-Cabeça 3D</span>
        <div class="score">Peças: <span class="score-val" id="piecesLeft">9</span></div>
        <span style="opacity:.6;font-size:.7em">Toque na peça para selecionar</span>
    </div>
    <div class="game-ctrls">
        <button class="ctrl" onclick="shufflePieces()">🔀</button>
        <button class="ctrl" onclick="resetPuzzle()">🔄</button>
        <button class="ctrl-wide ctrl-green" onclick="toggleAR()">📱 AR MODE</button>
        <button class="ctrl" onclick="closeGame()">✕</button>
    </div>
</div>

<!-- VITÓRIA -->
<div class="win-screen" id="winScreen">
    <div class="win-icon">🎉</div>
    <h2 style="color:#00cec9;margin:15px 0">PARABÉNS!</h2>
    <p style="opacity:.7;margin-bottom:20px">Quebra-cabeça montado!</p>
    <button class="btn btn-go" onclick="playAgain()">🔄 JOGAR DE NOVO</button>
    <button class="btn" style="background:#00c853;color:#000" onclick="toggleAR()">📱 VER EM AR</button>
</div>

<!-- AR MODE -->
<div id="arScreen">
    <video id="arVideo" autoplay playsinline muted></video>
    <canvas id="arCanvas"></canvas>
    <div class="bar"><span style="display:flex;align-items:center;gap:8px"><div style="width:8px;height:8px;border-radius:50%;background:#0f8;animation:pulse .8s infinite"></div><span>📱 AR - Quebra-Cabeça no Mundo Real</span></span></div>
    <div class="game-ctrls">
        <button class="ctrl" onclick="closeAR()">✕</button>
        <button class="ctrl" onclick="snapAR()">📸</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== VARIÁVEIS ====================
var scanner,scene,camera,renderer,pieces=[],selectedPiece=null,animId;
var gridSize=3, totalPieces=9, piecesPlaced=0;
var imgUrl=null, targetPositions=[];
var arStream=null, arScene,arCamera,arRenderer,arPieces=[];

// ==================== SCANNER ====================
function startScan(){
    document.getElementById('startScreen').style.display='none';
    document.getElementById('scanScreen').classList.add('on');
    scanner=new Html5Qrcode("reader");
    scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:200,height:200},aspectRatio:1.0},
        function(t){
            document.getElementById('sd').classList.add('ok');
            document.getElementById('st').textContent='✅ QR Lido! Gerando jogo...';
            if(navigator.vibrate)navigator.vibrate([50,30,100]);
            if(scanner){scanner.stop().catch(function(){});scanner=null;}
            setTimeout(function(){document.getElementById('scanScreen').classList.remove('on');loadImageAndStart();},500);
        },function(){}
    ).catch(function(){alert('Permita a câmera!');document.getElementById('startScreen').style.display='flex';});
}
function stopScan(){if(scanner){scanner.stop().catch(function(){});scanner=null;}document.getElementById('scanScreen').classList.remove('on');document.getElementById('startScreen').style.display='flex';}

// ==================== CARREGAR IMAGEM ====================
function loadImageAndStart(){
    var img=localStorage.getItem('currentImage')||localStorage.getItem('finalImage');
    if(img&&img.length>500&&img.startsWith('data:image')){imgUrl=img;initPuzzle(img);return;}
    var last=localStorage.getItem('lastUploadedImage');
    if(last){testAndInit(last);return;}
    fetch('https://api.github.com/repos/Hacdevcod/3dcam/contents/images')
    .then(function(r){return r.json();})
    .then(function(f){
        if(Array.isArray(f)&&f.length>0)testAndInit('https://raw.githubusercontent.com/Hacdevcod/3dcam/main/images/'+f[f.length-1].name);
        else initPuzzle(null);
    }).catch(function(){initPuzzle(null);});
}
function testAndInit(u){imgUrl=u;var t=new Image();t.crossOrigin='anonymous';t.onload=function(){initPuzzle(u);};t.onerror=function(){initPuzzle(null);};t.src=u;}

// ==================== INICIAR QUEBRA-CABEÇA ====================
function initPuzzle(src){
    document.getElementById('gameScreen').classList.add('on');
    document.getElementById('piecesLeft').textContent='9';
    piecesPlaced=0;
    pieces=[];
    targetPositions=[];
    selectedPiece=null;
    
    var canvas=document.getElementById('gameCanvas');
    var W=window.innerWidth,H=window.innerHeight;
    canvas.width=W;canvas.height=H;
    
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0a0a14);
    
    camera=new THREE.PerspectiveCamera(50,W/H,0.1,100);
    camera.position.set(0,0,7);
    
    renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
    renderer.setSize(W,H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    
    // Iluminação
    scene.add(new THREE.AmbientLight(0xffffff,0.7));
    var l1=new THREE.DirectionalLight(0xffffff,0.9);l1.position.set(3,5,5);scene.add(l1);
    var l2=new THREE.DirectionalLight(0x6c5ce7,0.4);l2.position.set(-3,1,3);scene.add(l2);
    
    // Fundo de grade (onde as peças se encaixam)
    var gridBg=new THREE.Mesh(
        new THREE.PlaneGeometry(4,4),
        new THREE.MeshBasicMaterial({color:0x1a1a3e,transparent:true,opacity:0.3,side:THREE.DoubleSide})
    );
    gridBg.position.z=-0.1;
    scene.add(gridBg);
    
    // Linhas da grade
    for(var i=0;i<=gridSize;i++){
        var pos=-2+i*(4/gridSize);
        scene.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(pos,-2,0),new THREE.Vector3(pos,2,0)]),
            new THREE.LineBasicMaterial({color:0x333355})
        ));
        scene.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-2,pos,0),new THREE.Vector3(2,pos,0)]),
            new THREE.LineBasicMaterial({color:0x333355})
        ));
    }
    
    // Criar textura das peças
    var finalSrc=src||createPuzzleImg();
    var loader=new THREE.TextureLoader();loader.crossOrigin='anonymous';
    loader.load(finalSrc,function(tex){
        createPieces(tex);
        shufflePieces();
    },undefined,function(){initPuzzleFallback();});
    
    setupGameTouch(canvas);
    animateGame();
}

function createPuzzleImg(){
    var c=document.createElement('canvas');c.width=600;c.height=600;
    var ctx=c.getContext('2d');
    var grd=ctx.createLinearGradient(0,0,600,600);
    grd.addColorStop(0,'#6c5ce7');grd.addColorStop(0.5,'#a29bfe');grd.addColorStop(1,'#00cec9');
    ctx.fillStyle=grd;ctx.fillRect(0,0,600,600);
    for(var i=0;i<9;i++){ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect((i%3)*200,(Math.floor(i/3))*200,200,200);ctx.fillStyle='white';ctx.font='bold 40px Arial';ctx.textAlign='center';ctx.fillText(i+1,(i%3)*200+100,(Math.floor(i/3))*200+120);}
    return c.toDataURL('image/png');
}

function createPieces(tex){
    var pieceW=4/gridSize;
    var pieceH=4/gridSize;
    
    for(var row=0;row<gridSize;row++){
        for(var col=0;col<gridSize;col++){
            var u0=col/gridSize, v0=row/gridSize;
            var u1=(col+1)/gridSize, v1=(row+1)/gridSize;
            
            // Criar textura recortada
            var pTex=tex.clone();
            pTex.repeat.set(1/gridSize,1/gridSize);
            pTex.offset.set(u0,v0);
            pTex.needsUpdate=true;
            
            var geo=new THREE.PlaneGeometry(pieceW*0.95,pieceH*0.95);
            var mat=new THREE.MeshStandardMaterial({
                map:pTex,
                roughness:0.3,
                metalness:0.1,
                side:THREE.DoubleSide
            });
            
            var piece=new THREE.Mesh(geo,mat);
            
            // Posição alvo (onde deve ser encaixada)
            var targetX=-2+col*pieceW+pieceW/2;
            var targetY=2-row*pieceH-pieceH/2;
            piece.userData={
                targetX:targetX,
                targetY:targetY,
                targetZ:0,
                row:row,col:col,
                placed:false
            };
            targetPositions.push({x:targetX,y:targetY,z:0});
            
            // Borda da peça
            piece.add(new THREE.LineSegments(
                new THREE.EdgesGeometry(geo),
                new THREE.LineBasicMaterial({color:0x6c5ce7,transparent:true,opacity:0.5})
            ));
            
            piece.castShadow=true;
            scene.add(piece);
            pieces.push(piece);
        }
    }
}

function initPuzzleFallback(){
    var tex=new THREE.CanvasTexture(createPuzzleImg());
    createPieces(tex);
    shufflePieces();
}

// ==================== EMBARALHAR ====================
function shufflePieces(){
    for(var i=0;i<pieces.length;i++){
        var p=pieces[i];
        p.position.set((Math.random()-0.5)*6,(Math.random()-0.5)*8,Math.random()*3);
        p.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
        p.userData.placed=false;
    }
    piecesPlaced=0;
    document.getElementById('piecesLeft').textContent=totalPieces;
    document.getElementById('winScreen').classList.remove('show');
    toast('🔀 Peças embaralhadas!');
}

// ==================== TOQUE (SELECIONAR + MOVER) ====================
var raycaster=new THREE.Raycaster();
var mouse=new THREE.Vector2();
var dragging=false;

function setupGameTouch(canvas){
    canvas.addEventListener('touchstart',function(e){
        e.preventDefault();
        var touch=e.touches[0];
        mouse.x=(touch.clientX/window.innerWidth)*2-1;
        mouse.y=-(touch.clientY/window.innerHeight)*2+1;
        
        raycaster.setFromCamera(mouse,camera);
        var intersects=raycaster.intersectObjects(pieces);
        
        if(intersects.length>0){
            selectedPiece=intersects[0].object;
            selectedPiece.material.emissive=new THREE.Color(0x333333);
            dragging=true;
        }
    },{passive:false});
    
    canvas.addEventListener('touchmove',function(e){
        e.preventDefault();
        if(!dragging||!selectedPiece)return;
        var touch=e.touches[0];
        mouse.x=(touch.clientX/window.innerWidth)*2-1;
        mouse.y=-(touch.clientY/window.innerHeight)*2+1;
        
        raycaster.setFromCamera(mouse,camera);
        var plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
        var point=new THREE.Vector3();
        raycaster.ray.intersectPlane(plane,point);
        
        if(point){
            selectedPiece.position.x=point.x;
            selectedPiece.position.y=point.y;
            selectedPiece.position.z=0.5;
            selectedPiece.rotation.set(0,0,0);
        }
    },{passive:false});
    
    canvas.addEventListener('touchend',function(){
        if(selectedPiece){
            selectedPiece.material.emissive=new THREE.Color(0x000000);
            checkPlacement(selectedPiece);
            selectedPiece=null;
            dragging=false;
        }
    });
    
    // Mouse
    canvas.addEventListener('mousedown',function(e){
        mouse.x=(e.clientX/window.innerWidth)*2-1;
        mouse.y=-(e.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse,camera);
        var intersects=raycaster.intersectObjects(pieces);
        if(intersects.length>0){selectedPiece=intersects[0].object;selectedPiece.material.emissive=new THREE.Color(0x333333);dragging=true;}
    });
    canvas.addEventListener('mousemove',function(e){
        if(!dragging||!selectedPiece)return;
        mouse.x=(e.clientX/window.innerWidth)*2-1;
        mouse.y=-(e.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse,camera);
        var plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
        var point=new THREE.Vector3();raycaster.ray.intersectPlane(plane,point);
        if(point){selectedPiece.position.x=point.x;selectedPiece.position.y=point.y;selectedPiece.position.z=0.5;selectedPiece.rotation.set(0,0,0);}
    });
    canvas.addEventListener('mouseup',function(){if(selectedPiece){selectedPiece.material.emissive=new THREE.Color(0x000000);checkPlacement(selectedPiece);selectedPiece=null;dragging=false;}});
}

function checkPlacement(piece){
    var tx=piece.userData.targetX;
    var ty=piece.userData.targetY;
    var dx=Math.abs(piece.position.x-tx);
    var dy=Math.abs(piece.position.y-ty);
    
    if(dx<0.4&&dy<0.4){
        // Encaixar!
        piece.position.set(tx,ty,0);
        piece.rotation.set(0,0,0);
        piece.userData.placed=true;
        piecesPlaced++;
        document.getElementById('piecesLeft').textContent=totalPieces-piecesPlaced;
        
        if(navigator.vibrate)navigator.vibrate(30);
        
        // Efeito de brilho
        piece.material.emissive=new THREE.Color(0x00ff88);
        setTimeout(function(){piece.material.emissive=new THREE.Color(0x000000);},300);
        
        if(piecesPlaced>=totalPieces){
            setTimeout(function(){
                document.getElementById('winScreen').classList.add('show');
                if(navigator.vibrate)navigator.vibrate([50,30,50,30,100]);
            },500);
        }
        toast('✅ Peça encaixada! ('+piecesPlaced+'/'+totalPieces+')');
    }
}

function resetPuzzle(){
    for(var i=0;i<pieces.length;i++){
        var p=pieces[i];
        if(p.userData.placed){
            p.position.set(p.userData.targetX,p.userData.targetY,0);
            p.rotation.set(0,0,0);
        }
    }
    toast('🔄 Posições resetadas');
}

function playAgain(){
    document.getElementById('winScreen').classList.remove('show');
    shufflePieces();
}

// ==================== AR MODE ====================
async function toggleAR(){
    if(arStream){closeAR();return;}
    
    document.getElementById('gameScreen').classList.remove('on');
    document.getElementById('winScreen').classList.remove('show');
    document.getElementById('arScreen').classList.add('on');
    
    var video=document.getElementById('arVideo');
    var canvas=document.getElementById('arCanvas');
    canvas.width=window.innerWidth;canvas.height=window.innerHeight;
    
    try{
        arStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});
        video.srcObject=arStream;video.play();
        
        arScene=new THREE.Scene();
        arCamera=new THREE.PerspectiveCamera(50,canvas.width/canvas.height,0.1,100);
        arCamera.position.set(0,0,5);
        arRenderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
        arRenderer.setSize(canvas.width,canvas.height);
        
        arScene.add(new THREE.AmbientLight(0xffffff,0.9));
        var l=new THREE.DirectionalLight(0xffffff,1.2);l.position.set(2,4,3);arScene.add(l);
        
        // Clonar peças para o AR
        arPieces=[];
        for(var i=0;i<pieces.length;i++){
            var clone=pieces[i].clone(true);
            clone.material=pieces[i].material.clone();
            clone.position.copy(pieces[i].position);
            clone.scale.set(1.3,1.3,1.3);
            arPieces.push(clone);
            arScene.add(clone);
        }
        
        function arAnim(){if(!arStream)return;requestAnimationFrame(arAnim);arPieces.forEach(function(p){p.rotation.y+=0.003;});arRenderer.render(arScene,arCamera);}
        arAnim();
        toast('📱 AR Mode!');
    }catch(e){alert('Erro câmera: '+e.message);closeAR();}
}

function closeAR(){
    if(arStream){arStream.getTracks().forEach(function(t){t.stop();});arStream=null;}
    if(arRenderer)arRenderer.dispose();
    arScene=null;arPieces=[];
    document.getElementById('arScreen').classList.remove('on');
    document.getElementById('gameScreen').classList.add('on');
}
function snapAR(){var v=document.getElementById('arVideo');var c2=document.getElementById('arCanvas');var fc=document.createElement('canvas');fc.width=window.innerWidth;fc.height=window.innerHeight;var ctx=fc.getContext('2d');ctx.drawImage(v,0,0,fc.width,fc.height);ctx.drawImage(c2,0,0);var a=document.createElement('a');a.download='puzzle-ar-'+Date.now()+'.png';a.href=fc.toDataURL('image/png');a.click();toast('📸 Foto AR!');}

// ==================== ANIMAÇÃO ====================
function animateGame(){
    animId=requestAnimationFrame(animateGame);
    pieces.forEach(function(p){
        if(!p.userData.placed&&p!==selectedPiece){
            p.rotation.z+=0.002;
            p.position.z=Math.sin(Date.now()*0.001+p.position.x)*0.3;
        }
    });
    if(renderer&&scene&&camera)renderer.render(scene,camera);
}

function closeGame(){if(animId)cancelAnimationFrame(animId);if(renderer)renderer.dispose();scene=null;pieces=[];renderer=null;document.getElementById('gameScreen').classList.remove('on');document.getElementById('startScreen').style.display='flex';}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
window.addEventListener('resize',function(){if(renderer&&camera){var W=window.innerWidth,H=window.innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);}});
</script>
</body>
</html>
