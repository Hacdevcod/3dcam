<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>3dcam AR</title>
    
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#000;overflow:hidden;height:100dvh;width:100dvw;position:fixed}
        
        #startScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14;z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px;color:#fff;text-align:center}
        h2{font-size:1.2em;margin-bottom:8px;color:#a29bfe}
        p{opacity:.7;margin-bottom:16px;font-size:.85em;line-height:1.4}
        .btn{display:block;width:100%;max-width:280px;padding:15px;border:none;border-radius:14px;font-size:1.1em;font-weight:600;cursor:pointer;margin:8px auto;color:#fff}
        .btn-go{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
        
        #scanScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;flex-direction:column}
        #scanScreen.on{display:flex}
        #reader{width:100%!important;height:100%!important;flex:1}
        #reader video{width:100%!important;height:100%!important;object-fit:cover!important}
        #reader img,#reader__scan_region,#reader__dashboard_section,#html5-qrcode-button-camera-permission,#html5-qrcode-button-camera-start,#html5-qrcode-button-camera-stop{display:none!important}
        
        .scan-bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.8);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.78em}
        .scan-dot{width:7px;height:7px;border-radius:50%;background:#f44;animation:pulse 1s infinite}
        .scan-dot.ok{background:#0f8;animation:none}@keyframes pulse{50%{transform:scale(1.8);opacity:.4}}
        .scan-frame{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;pointer-events:none}
        .sf-inner{width:180px;height:180px;position:relative}
        .corner{position:absolute;width:22px;height:22px;border-color:#00cec9;border-style:solid}
        .corner.tl{top:0;left:0;border-width:3px 0 0 3px;border-radius:6px 0 0 0}
        .corner.tr{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 6px 0 0}
        .corner.bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 6px}
        .corner.br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 6px 0}
        .scan-line{position:absolute;left:0;width:100%;height:2px;background:#00cec9;animation:scanUpDown 2s linear infinite}
        @keyframes scanUpDown{0%{top:0}100%{top:100%}}
        
        #arScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14}
        #arScreen.on{display:block}
        #arCanvas{width:100%!important;height:100%!important;display:block}
        
        .ar-bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.7);padding:8px 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.75em}
        .ar-ctrls{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:8px}
        .ctrl{width:40px;height:40px;border-radius:50%;background:rgba(108,92,231,.85);border:none;color:#fff;font-size:1.1em;cursor:pointer}
        .ctrl:active{transform:scale(.9)}
        .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.9);color:#fff;padding:8px 18px;border-radius:20px;font-size:.75em;z-index:200;transition:.3s;pointer-events:none}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:300;color:#fff;text-align:center;display:none}
        .loading.show{display:block}
        .spinner{width:35px;height:35px;border:3px solid rgba(108,92,231,.2);border-top-color:#00cec9;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>

<div id="startScreen">
    <div style="font-size:55px;margin-bottom:8px">📸</div>
    <h2>3dcam AR</h2>
    <p>1. Toque em INICIAR<br>2. Aponte para o QR Code<br>3. Imagem aparece em 3D!</p>
    <button class="btn btn-go" onclick="startScan()">📷 INICIAR</button>
</div>

<div id="scanScreen">
    <div class="scan-bar">
        <span style="display:flex;align-items:center;gap:6px"><div class="scan-dot" id="sd"></div><span id="st">Aponte para o QR Code</span></span>
        <button class="ctrl" onclick="stopScan()" style="position:static;width:auto;height:auto;border-radius:16px;padding:5px 12px;font-size:.7em">✕</button>
    </div>
    <div id="reader"></div>
    <div class="scan-frame"><div class="sf-inner"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div class="scan-line"></div></div></div>
</div>

<div id="arScreen">
    <div class="loading show" id="loading3d"><div class="spinner"></div><p>Renderizando 3D...</p></div>
    <canvas id="arCanvas"></canvas>
    <div class="ar-bar"><span style="display:flex;align-items:center;gap:6px"><div style="width:7px;height:7px;border-radius:50%;background:#0f8"></div><span>✨ Arraste para girar | Dois dedos zoom</span></span></div>
    <div class="ar-ctrls">
        <button class="ctrl" onclick="resetView()">🔄</button>
        <button class="ctrl" onclick="toggleSpin()">⏯️</button>
        <button class="ctrl" onclick="snapPhoto()">📸</button>
        <button class="ctrl" onclick="closeAR()">✕</button>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ==================== SCANNER ====================
var scanner=null;

function startScan(){
    document.getElementById('startScreen').style.display='none';
    document.getElementById('scanScreen').classList.add('on');
    
    scanner=new Html5Qrcode("reader");
    scanner.start(
        {facingMode:"environment"},
        {fps:10,qrbox:{width:180,height:180},aspectRatio:1.0},
        function(text){
            document.getElementById('sd').classList.add('ok');
            document.getElementById('st').textContent='✅ QR Lido!';
            if(navigator.vibrate)navigator.vibrate([50,30,100]);
            if(scanner){scanner.stop().catch(function(){});scanner=null;}
            setTimeout(function(){
                document.getElementById('scanScreen').classList.remove('on');
                loadImage();
            },400);
        },
        function(){}
    ).catch(function(){
        alert('Erro: Permita a câmera!\nChrome > Configurações > Site > Câmera');
        document.getElementById('startScreen').style.display='flex';
        document.getElementById('scanScreen').classList.remove('on');
    });
}

function stopScan(){
    if(scanner){scanner.stop().catch(function(){});scanner=null;}
    document.getElementById('scanScreen').classList.remove('on');
    document.getElementById('startScreen').style.display='flex';
}

// ==================== CARREGAR IMAGEM ====================
function loadImage(){
    document.getElementById('arScreen').classList.add('on');
    document.getElementById('loading3d').classList.add('show');
    
    // 1. localStorage
    var img=localStorage.getItem('currentImage')||localStorage.getItem('finalImage');
    if(img&&img.length>500&&img.startsWith('data:image')){
        console.log('localStorage OK');
        init3D(img);
        return;
    }
    
    // 2. GitHub API
    fetch('https://api.github.com/repos/Hacdevcod/3dcam/contents/images')
    .then(function(r){return r.json();})
    .then(function(files){
        if(Array.isArray(files)&&files.length>0){
            var url='https://raw.githubusercontent.com/Hacdevcod/3dcam/main/images/'+files[files.length-1].name;
            testAndInit(url);
        }else{init3D(null);}
    })
    .catch(function(){
        // 3. lastUploadedImage
        var last=localStorage.getItem('lastUploadedImage');
        if(last){testAndInit(last);}else{init3D(null);}
    });
}

function testAndInit(url){
    var test=new Image();
    test.crossOrigin='anonymous';
    test.onload=function(){init3D(url);};
    test.onerror=function(){init3D(null);};
    test.src=url;
}

// ==================== THREE.JS 3D ====================
var scene,camera,renderer,mesh,animId;
var spinning=true;
var currentTexture=null;

function init3D(imgSrc){
    var canvas=document.getElementById('arCanvas');
    var W=window.innerWidth;
    var H=window.innerHeight;
    canvas.width=W;
    canvas.height=H;
    
    // Scene
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0a0a14);
    
    // Camera
    camera=new THREE.PerspectiveCamera(50,W/H,0.1,100);
    camera.position.set(0,0,5);
    
    // Renderer
    renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:false});
    renderer.setSize(W,H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.outputEncoding=THREE.sRGBEncoding;
    
    // Luzes
    scene.add(new THREE.AmbientLight(0xffffff,0.6));
    var light1=new THREE.DirectionalLight(0xffffff,0.8);
    light1.position.set(5,5,5);
    scene.add(light1);
    var light2=new THREE.DirectionalLight(0x6c5ce7,0.4);
    light2.position.set(-3,0,3);
    scene.add(light2);
    
    // Partículas
    var pGeo=new THREE.BufferGeometry();
    var pCount=400;
    var positions=new Float32Array(pCount*3);
    for(var i=0;i<pCount*3;i++)positions[i]=(Math.random()-0.5)*10;
    pGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
    var pMat=new THREE.PointsMaterial({size:0.03,color:0x6c5ce7,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending});
    scene.add(new THREE.Points(pGeo,pMat));
    
    // Anel
    var ring=new THREE.Mesh(
        new THREE.TorusGeometry(1.5,0.03,16,80),
        new THREE.MeshBasicMaterial({color:0x00cec9,transparent:true,opacity:0.4})
    );
    ring.rotation.x=Math.PI/2;
    ring.name='ring';
    scene.add(ring);
    
    // Carregar textura
    var finalSrc=imgSrc||createFallback();
    var loader=new THREE.TextureLoader();
    loader.crossOrigin='anonymous';
    
    loader.load(finalSrc,
        function(texture){
            console.log('Textura OK:',texture.image.width,texture.image.height);
            currentTexture=texture;
            createMesh(texture);
            document.getElementById('loading3d').classList.remove('show');
            toast('✨ 3D pronto!');
        },
        undefined,
        function(err){
            console.error('Erro textura:',err);
            var fb=createFallback();
            var tex=new THREE.CanvasTexture(fb);
            currentTexture=tex;
            createMesh(tex);
            document.getElementById('loading3d').classList.remove('show');
            toast('⚠️ Imagem demo');
        }
    );
    
    // Touch
    setupTouch(canvas);
    
    // Animar
    animate();
}

function createMesh(texture){
    if(mesh)scene.remove(mesh);
    var aspect=1;
    if(texture.image)aspect=texture.image.width/texture.image.height;
    var w=aspect*2.5;
    var h=2.5;
    var geo=new THREE.PlaneGeometry(w,h);
    var mat=new THREE.MeshStandardMaterial({
        map:texture,
        side:THREE.DoubleSide,
        roughness:0.3,
        metalness:0.05
    });
    mesh=new THREE.Mesh(geo,mat);
    scene.add(mesh);
    
    // Borda
    var edge=new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({color:0x6c5ce7})
    );
    mesh.add(edge);
}

function createFallback(){
    var c=document.createElement('canvas');
    c.width=600;c.height=400;
    var ctx=c.getContext('2d');
    var grd=ctx.createLinearGradient(0,0,600,400);
    grd.addColorStop(0,'#6c5ce7');grd.addColorStop(1,'#00cec9');
    ctx.fillStyle=grd;ctx.fillRect(0,0,600,400);
    ctx.fillStyle='white';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText('3dcam 3D',300,170);
    ctx.fillText('Envie imagem pelo PC',300,220);
    return c.toDataURL('image/png');
}

function setupTouch(canvas){
    var dragging=false,px=0,py=0;
    var lastDist=0;
    
    canvas.addEventListener('touchstart',function(e){
        e.preventDefault();
        if(e.touches.length===1){dragging=true;px=e.touches[0].clientX;py=e.touches[0].clientY;}
        if(e.touches.length===2){lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
    },{passive:false});
    
    canvas.addEventListener('touchmove',function(e){
        e.preventDefault();
        if(e.touches.length===1&&dragging&&mesh){
            mesh.rotation.y+=(e.touches[0].clientX-px)*0.01;
            mesh.rotation.x+=(e.touches[0].clientY-py)*0.01;
            px=e.touches[0].clientX;py=e.touches[0].clientY;
        }
        if(e.touches.length===2&&mesh){
            var dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
            var delta=dist-lastDist;
            camera.position.z-=delta*0.02;
            camera.position.z=Math.max(2,Math.min(10,camera.position.z));
            lastDist=dist;
        }
    },{passive:false});
    
    canvas.addEventListener('touchend',function(){dragging=false;});
    
    // Mouse
    canvas.addEventListener('mousedown',function(e){dragging=true;px=e.clientX;py=e.clientY;});
    canvas.addEventListener('mousemove',function(e){
        if(!dragging||!mesh)return;
        mesh.rotation.y+=(e.clientX-px)*0.01;
        mesh.rotation.x+=(e.clientY-py)*0.01;
        px=e.clientX;py=e.clientY;
    });
    canvas.addEventListener('mouseup',function(){dragging=false;});
    canvas.addEventListener('wheel',function(e){
        e.preventDefault();
        camera.position.z+=e.deltaY*0.01;
        camera.position.z=Math.max(2,Math.min(10,camera.position.z));
    },{passive:false});
}

function animate(){
    animId=requestAnimationFrame(animate);
    if(mesh&&spinning)mesh.rotation.y+=0.005;
    if(mesh&&spinning)mesh.position.y=Math.sin(Date.now()*0.001)*0.1;
    var ring=scene.getObjectByName('ring');
    if(ring){ring.rotation.z+=0.01;ring.rotation.x+=0.005;}
    if(renderer&&scene&&camera)renderer.render(scene,camera);
}

// ==================== CONTROLES ====================
function resetView(){if(mesh)mesh.rotation.set(0,0,0);camera.position.set(0,0,5);toast('🔄 Reset');}
function toggleSpin(){spinning=!spinning;toast(spinning?'▶️ Girando':'⏸️ Pausado');}
function snapPhoto(){
    if(!renderer)return;
    renderer.render(scene,camera);
    var a=document.createElement('a');
    a.download='3dcam-'+Date.now()+'.png';
    a.href=renderer.domElement.toDataURL('image/png');
    a.click();
    toast('📸 Foto salva!');
}
function closeAR(){
    if(animId)cancelAnimationFrame(animId);
    if(renderer)renderer.dispose();
    scene=null;mesh=null;renderer=null;
    document.getElementById('arScreen').classList.remove('on');
    document.getElementById('startScreen').style.display='flex';
    spinning=true;
}
function toast(m){
    var t=document.getElementById('toast');
    t.textContent=m;t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},2000);
}
window.addEventListener('resize',function(){
    if(!renderer||!camera)return;
    var W=window.innerWidth,H=window.innerHeight;
    camera.aspect=W/H;camera.updateProjectionMatrix();
    renderer.setSize(W,H);
});
</script>
</body>
</html>
